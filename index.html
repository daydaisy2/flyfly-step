<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>리훨 임챌</title>
<meta name="description" content="리훨 임챌 — 부부데이지의 지역별 임장노트">
<meta name="theme-color" content="#F7F5EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13121A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="리훨 임챌">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  /* ============================================================
     리훨 임챌 — 디자인 v2
     · 따뜻한 오프화이트 바탕 + 노랑은 포인트로만, 네이비는 글자·강조색
     · 그림자 대신 얇은 선, 큰 글씨(본문 14px 안팎), 넉넉한 터치 영역
     · 시스템 다크 모드 지원
     ============================================================ */
  :root{
    color-scheme:light dark;
    --bg:#F7F5EF;
    --surface:#FFFFFF;
    --surface-2:#F2EFE6;      /* 카드 안 보조 면 */
    --surface-3:#E9E5D8;
    --line:#E7E2D3;
    --ink:#1B1A17;
    --ink-2:#47443A;
    --muted:#85816F;
    --faint:#B3AE9A;
    --brand:#FBE049;          /* 포인트 노랑 */
    --brand-soft:#FFF5C2;
    --accent:#1E1B7A;         /* 네이비: 제목·버튼 */
    --accent-2:#2A2694;
    --on-accent:#FFFFFF;
    --accent-soft:#ECEBFA;
    --green:#1F8A4C;
    --green-soft:#E3F3E6;
    --green-ink:#1F4D2D;
    --red:#C0352B;
    --red-soft:#FBE9E6;
    --star:#F0B429;
    --stamp:#C0392B;
    --hero-a:#2B2799;
    --hero-b:#1E1B7A;
    --hero-hi:#FFE680;
    --hero-lo:#D3D0F5;
    --scrim:rgba(24,21,8,.5);
    --r:20px;
    --r-sm:12px;
    --shadow:0 1px 0 rgba(40,32,0,.03),0 8px 24px -12px rgba(60,48,0,.18);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#13121A;
      --surface:#1C1B26;
      --surface-2:#252433;
      --surface-3:#302F42;
      --line:#2E2D3F;
      --ink:#F2F0E8;
      --ink-2:#CBC8BC;
      --muted:#9A97A8;
      --faint:#6E6C80;
      --brand:#FBE049;
      --brand-soft:#3A3512;
      --accent:#C7C4FF;
      --accent-2:#DAD8FF;
      --on-accent:#16143F;
      --accent-soft:#2A2850;
      --green:#58C887;
      --green-soft:#17301F;
      --green-ink:#BFE8CC;
      --red:#FF8A7E;
      --red-soft:#3B1F1D;
      --star:#F5C451;
      --stamp:#FF8A7E;
      --scrim:rgba(0,0,0,.62);
      --shadow:0 0 0 1px rgba(255,255,255,.02);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Malgun Gothic","Segoe UI",system-ui,sans-serif;
    font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
    word-break:keep-all;overflow-wrap:break-word;overscroll-behavior-y:none;
  }
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
  input,textarea,select{font:inherit;color:inherit}
  a{color:inherit}
  .hidden{display:none !important}
  button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
    outline:2px solid var(--accent);outline-offset:2px}

  /* ============ 틀 ============ */
  #app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg)}
  @media (min-width:600px){
    body{background:var(--surface-3)}
    #app{box-shadow:0 0 0 1px var(--line),0 20px 60px -30px rgba(0,0,0,.35)}
  }
  .top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:calc(env(safe-area-inset-top) + 12px) 18px 10px}
  .brand{display:flex;align-items:center;gap:9px;margin:0;font-size:21px;font-weight:900;
    letter-spacing:-.04em;color:var(--ink);line-height:1}
  .brand .fl{width:32px;height:32px;border-radius:11px;background:var(--brand);display:grid;place-items:center;
    font-size:16px;box-shadow:0 4px 10px -4px rgba(150,120,0,.55)}
  .top-right{display:flex;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);transition:background .3s;margin-right:2px}
  .dot.live{background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 22%,transparent)}
  .dot.warn{background:#D08A17}
  .dot.off{background:var(--faint)}
  .lock-btn,.memo-btn{position:relative;width:38px;height:38px;border-radius:13px;display:grid;place-items:center;
    background:var(--surface);border:1px solid var(--line);font-size:15px;color:var(--accent);line-height:1;
    transition:background .18s,color .18s,border-color .18s}
  .lock-btn.on{background:var(--brand);border-color:transparent;color:#1B1A17}
  .memo-btn.has{background:var(--accent);border-color:transparent;color:var(--on-accent)}
  .memo-cnt{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;
    background:#E8603C;color:#fff;font-size:10.5px;font-weight:900;line-height:18px;text-align:center;
    border:2px solid var(--bg)}
  .memo-cnt[hidden]{display:none}
  .memo-add{width:100%;height:46px;border-radius:14px;border:0;cursor:pointer;background:var(--surface-2);
    color:var(--accent);font-family:inherit;font-size:14px;font-weight:800;letter-spacing:-.02em}
  .memo-add:active{transform:scale(.99)}
  .memo-list{display:flex;flex-direction:column;gap:8px}
  .memo-row{display:flex;align-items:flex-start;gap:8px;background:var(--surface-2);border-radius:14px;padding:11px 12px}
  .memo-row .mx{flex:1 1 auto;min-width:0;font-size:13.5px;font-weight:600;color:var(--ink-2);line-height:1.5;
    letter-spacing:-.02em;white-space:pre-line;word-break:break-word}
  .memo-del{flex:0 0 auto;width:30px;height:30px;border:0;border-radius:10px;background:var(--red-soft);color:var(--red);
    font-size:12px;font-weight:900;display:grid;place-items:center;cursor:pointer}
  .memo-empty{margin:10px 0;text-align:center;font-size:13px;font-weight:600;color:var(--muted);line-height:1.6}
  .memo-wrap .sheet-f .btn-navy{flex:1 1 auto}
  .btn-ghost.confirm{background:var(--red);color:#fff}
  #view{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:4px 16px 28px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
  #view>*{flex:0 0 auto}
  #view::-webkit-scrollbar{display:none}
  .tabs{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--line)}
  .tab{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:7px;padding:11px 0;border-radius:14px;
    font-size:13.5px;font-weight:800;color:var(--muted);letter-spacing:-.02em;transition:background .18s,color .18s}
  .tab .ic{display:grid;place-items:center;height:20px;font-size:17px;line-height:1;opacity:.7;transition:opacity .18s}
  .tab .ic svg{width:20px;height:20px;display:block}
  .tab.on{color:#1B1A17;background:var(--brand)}
  .tab.on .ic{opacity:1}

  /* ============ 공통 카드 ============ */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card-h h2{margin:0;font-size:16px;font-weight:900;letter-spacing:-.035em;color:var(--ink)}
  .pill{flex:0 0 auto;font-size:11.5px;font-weight:800;color:var(--ink-2);background:var(--surface-2);
    padding:4px 10px;border-radius:999px;letter-spacing:-.02em;line-height:1.3}
  .pill.navy{color:var(--accent);background:var(--accent-soft)}
  .pill.green{color:var(--green-ink);background:var(--green-soft)}
  .hero{position:relative;overflow:hidden;background:linear-gradient(155deg,var(--hero-a),var(--hero-b) 66%);color:#fff;
    border-radius:24px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:8px;
    box-shadow:0 18px 34px -18px rgba(30,27,122,.6)}
  .hero::after{content:"";position:absolute;right:-34px;top:-34px;width:130px;height:130px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(251,224,73,.55),rgba(251,224,73,0) 68%);pointer-events:none}
  .hero-top{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--hero-lo);letter-spacing:-.01em}
  .hero-main{font-size:24px;font-weight:900;letter-spacing:-.045em;line-height:1.25}
  .hero-main b{color:var(--hero-hi)}
  .hero-sub{font-size:13px;font-weight:700;color:var(--hero-lo);letter-spacing:-.02em}
  .bar{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:999px;background:var(--accent);width:0;
    transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .hero .bar{background:rgba(255,255,255,.2);margin-top:4px}
  .hero .bar i{background:var(--hero-hi)}
  .rowline{display:flex;align-items:flex-start;gap:10px;background:var(--surface-2);border-radius:14px;
    padding:11px 13px;font-size:14px;font-weight:600;letter-spacing:-.02em;line-height:1.5;color:var(--ink-2)}
  .rowline .k{flex:0 0 auto;width:auto;min-width:64px;font-weight:800;color:var(--muted);font-size:12.5px;line-height:1.7}
  .rowline .v{flex:1 1 auto;min-width:0}
  .rowline .v b{color:var(--accent);font-weight:900}
  .rowline.green{background:var(--green-soft);color:var(--green-ink)}
  .rowline.green .k{color:var(--green)}
  .rowline.green .v b{color:var(--green)}
  .rowline.stack{flex-direction:column;gap:2px}
  .rowline.stack .k{min-width:0;line-height:1.4}
  .muted{color:var(--muted);font-weight:600}
  .foot-note{margin:4px 4px 6px;font-size:12px;font-weight:600;color:var(--muted);text-align:center;letter-spacing:-.02em;line-height:1.6}
  .empty-line{font-size:13.5px;font-weight:600;color:var(--faint);background:var(--surface-2);border-radius:14px;padding:13px 14px;letter-spacing:-.02em}
  .pen{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);
    font-size:13px;line-height:1;flex:0 0 auto}
  .pen:active{background:var(--surface-3)}

  /* ============ 홈 ============ */
  .chips-row{display:flex;gap:7px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
  .chips-row::-webkit-scrollbar{display:none}
  .fchip{flex:0 0 auto;padding:9px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);
    font-size:13px;font-weight:800;color:var(--ink-2);letter-spacing:-.02em;transition:background .15s,color .15s,border-color .15s}
  .fchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .rcard{width:100%;gap:8px;transition:transform .12s,border-color .15s}
  .rcard:active{transform:scale(.99);border-color:var(--faint)}
  .rc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .rc-name{margin:0;font-size:19px;font-weight:900;letter-spacing:-.045em;color:var(--ink);line-height:1.25}
  .rc-meta{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:-.02em}
  .stars{letter-spacing:1px;font-size:13px;color:var(--star)}
  .stars .off{color:var(--surface-3)}
  .rc-key{font-size:14.5px;font-weight:800;color:var(--ink);letter-spacing:-.025em}
  .rc-price{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:-.02em;margin-top:-4px}
  .rc-tag{margin:2px 0 0;font-size:13.5px;font-weight:600;color:var(--ink-2);line-height:1.55;
    background:var(--surface-2);border-radius:14px;padding:11px 13px}
  .rc-foot{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:-.02em;margin-top:2px}
  .rc-foot .arrow{margin-left:auto;font-size:20px;color:var(--faint);line-height:1}
  .add-btn{width:100%;height:56px;border-radius:18px;background:var(--accent);color:var(--on-accent);
    font-size:15.5px;font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .12s}
  .add-btn:active{transform:scale(.985)}
  .g5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .g5 .gi{background:var(--surface-2);border-radius:14px;padding:12px 2px 10px;text-align:center;
    font-size:12px;font-weight:800;color:var(--ink-2);letter-spacing:-.03em;line-height:1.2}
  .g5 .gi span{display:block;font-size:20px;line-height:1;margin-bottom:7px}
  .g5 .gi b{color:var(--accent)}
  .empty-card{align-items:center;text-align:center;gap:10px;padding:34px 20px}
  .empty-card .ef{font-size:38px;line-height:1}
  .empty-card h2{margin:0;font-size:17px;font-weight:900;letter-spacing:-.035em;color:var(--ink)}
  .empty-card p{margin:0;font-size:13.5px;font-weight:600;color:var(--muted);line-height:1.6;letter-spacing:-.02em}

  /* ============ 상세 ============ */
  .back{align-self:flex-start;display:flex;align-items:center;gap:6px;padding:9px 15px 9px 11px;border-radius:999px;
    background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:800;color:var(--ink-2);letter-spacing:-.02em}
  .dhead{gap:10px}
  .ov-lab{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--muted);
    letter-spacing:-.02em;margin-bottom:4px}
  .mapbtn{display:flex;align-items:center;gap:9px;width:100%;min-height:50px;border-radius:14px;background:var(--surface-2);
    border:1px solid var(--line);padding:0 14px;font-size:14px;font-weight:800;color:var(--accent);
    text-decoration:none;letter-spacing:-.02em;line-height:1.25}
  .mapbtn .mg{font-size:18px;line-height:1;flex:0 0 auto}
  .mapbtn .mt{flex:1 1 auto;min-width:0;text-align:left}
  .mapbtn .mx{margin-left:auto;flex:0 0 auto;font-size:12px;font-weight:700;color:var(--muted)}
  .mapbtn:active{background:var(--surface-3)}
  .maprow{display:flex;gap:7px}
  .maprow .mapbtn{flex:1 1 0;min-width:0}
  .mapbtn.sm{min-height:42px;border-radius:12px;background:var(--surface);font-size:12.5px}
  .mapbtn.sm .mg{font-size:15px}
  .mapbtn.sm .mt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .dh-name{margin:0;font-size:24px;font-weight:900;letter-spacing:-.05em;color:var(--ink);line-height:1.2}
  .dh-meta{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:-.02em}
  .dh-tag{margin:0;font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.55;letter-spacing:-.025em}
  .dh-sum{display:flex;flex-direction:column;gap:7px;margin-top:2px}
  .dh-act{display:flex;gap:8px;margin-top:2px}
  .mini-btn{flex:1 1 0;height:44px;border-radius:13px;background:var(--surface-2);font-size:13.5px;font-weight:800;
    color:var(--accent);display:flex;align-items:center;justify-content:center;letter-spacing:-.02em}
  .mini-btn.danger{color:var(--red);flex:0 0 auto;padding:0 18px}
  .pts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .pts li{background:var(--surface-2);border-radius:14px;padding:11px 13px}
  .pts .k{display:block;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:-.02em;margin-bottom:3px}
  .pts .v{display:block;font-size:14px;font-weight:600;color:var(--ink-2);line-height:1.55;letter-spacing:-.02em}
  .go{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:14px;padding:13px 14px;
    font-size:14px;font-weight:800;color:var(--accent);letter-spacing:-.02em;text-decoration:none;line-height:1.35}
  .go .gi{flex:0 0 auto;font-size:16px}
  .go .gx{margin-left:auto;color:var(--faint);font-size:13px;font-weight:700;flex:0 0 auto}
  .quote{margin:0;background:var(--surface-2);border-left:4px solid var(--accent);border-radius:0 14px 14px 0;
    padding:13px 15px;font-size:14px;font-weight:700;color:var(--ink);line-height:1.55;letter-spacing:-.02em}
  .quote.green{border-left-color:var(--green)}
  .cap-l{margin:0;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:-.02em}
  .steps2{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .steps2 li{display:flex;gap:11px;align-items:flex-start;background:var(--surface-2);border-radius:14px;padding:11px 13px}
  .steps2 .n{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);
    font-size:12px;font-weight:900;display:grid;place-items:center;margin-top:1px}
  .steps2 .t{flex:1 1 auto;min-width:0}
  .steps2 .p{display:block;font-size:14.5px;font-weight:800;color:var(--ink);letter-spacing:-.025em;line-height:1.4}
  .steps2 .h{display:inline-block;margin-top:4px;font-size:11.5px;font-weight:800;color:var(--green);background:var(--green-soft);
    border-radius:999px;padding:2px 9px;letter-spacing:-.02em}
  .steps2 .m{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-top:4px;line-height:1.5;letter-spacing:-.02em}
  .cx{border-radius:18px;background:var(--surface-2);padding:15px 15px 14px;display:flex;flex-direction:column;gap:10px}
  .cx-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .cx-h h3{margin:0;font-size:16.5px;font-weight:900;letter-spacing:-.04em;color:var(--ink);line-height:1.3}
  .cx-act{display:flex;gap:6px;flex:0 0 auto}
  .cx-act .pen{width:30px;height:30px;background:var(--surface);font-size:12px}
  .spec{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
  .sp{display:flex;flex-direction:column;gap:1px;min-width:0}
  .sp:last-child:nth-child(odd){grid-column:1 / -1}
  .sp .k{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:-.02em}
  .sp .v{font-size:14px;font-weight:700;color:var(--ink);line-height:1.4;letter-spacing:-.02em}
  .prs{display:flex;flex-direction:column;gap:5px;background:var(--surface);border-radius:13px;padding:11px 13px}
  .pr{display:flex;align-items:baseline;gap:8px}
  .pr .k{flex:0 0 auto;width:70px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:-.02em}
  .pr .v{flex:1 1 auto;font-size:14px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
  .pr.ask .v{color:var(--accent)}
  .pr.jeon .v{color:var(--green)}
  .memo{margin:0;font-size:13.5px;font-weight:600;color:var(--ink-2);line-height:1.55;letter-spacing:-.02em;
    background:var(--surface);border-radius:13px;padding:11px 13px}
  .qa{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border-radius:14px;padding:12px 13px}
  .qa .q{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);
    font-size:12px;font-weight:900;display:grid;place-items:center;margin-top:1px}
  .qa .b{flex:1 1 auto;min-width:0}
  .qa .qq{display:block;font-size:14px;font-weight:800;color:var(--ink);letter-spacing:-.025em;line-height:1.45}
  .qa .aa{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2);margin-top:4px;line-height:1.6;letter-spacing:-.02em}
  .qa .mm{display:inline-block;margin-top:6px;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--surface);
    padding:3px 9px;border-radius:999px}
  .vd{display:flex;flex-direction:column;gap:8px;margin-top:2px}
  .vd-2col{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .vd-col{background:var(--surface-2);border-radius:14px;padding:12px 12px}
  .vd-col h4{margin:0 0 6px;font-size:12px;font-weight:800;letter-spacing:-.02em;color:var(--muted)}
  .vd-col.good h4{color:var(--green)}
  .vd-col.bad h4{color:#C4572B}
  .vd-col ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
  .vd-col li{font-size:13px;font-weight:600;color:var(--ink-2);line-height:1.45;letter-spacing:-.02em;
    padding-left:15px;position:relative}
  .vd-col li::before{content:"·";position:absolute;left:3px;color:var(--faint)}
  .vd-col.good li::before{content:"✓";left:0;font-size:11px;color:var(--green)}
  .vd-col.bad li::before{content:"!";left:1px;font-size:11px;color:#C4572B}

  /* ============ 체크리스트 ============ */
  .stage{display:flex;flex-direction:column;gap:9px}
  .stage-h{display:flex;align-items:center;gap:10px}
  .stage-n{flex:0 0 auto;width:28px;height:28px;border-radius:10px;background:var(--accent);color:var(--on-accent);
    font-size:13px;font-weight:900;display:grid;place-items:center}
  .stage-t{margin:0;font-size:15.5px;font-weight:900;letter-spacing:-.035em;color:var(--ink)}
  .stage-s{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:-.02em;margin-top:1px}
  .stage-c{margin-left:auto;font-size:12px;font-weight:800;color:var(--ink-2);background:var(--surface-2);padding:4px 10px;border-radius:999px}
  .ck{display:flex;gap:11px;align-items:flex-start;width:100%;background:var(--surface-2);border-radius:14px;
    padding:13px 14px;font-size:14px;font-weight:600;color:var(--ink-2);line-height:1.5;letter-spacing:-.02em;text-align:left}
  .ck .box{flex:0 0 auto;width:22px;height:22px;border-radius:8px;border:2px solid var(--faint);background:var(--surface);
    display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff;margin-top:0}
  .ck.on{background:var(--green-soft);color:var(--green-ink)}
  .ck.on .box{background:var(--green);border-color:var(--green)}
  .ck .t{flex:1 1 auto;min-width:0}
  .ck .d{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-top:2px}
  .ck[disabled]{opacity:1;cursor:default}

  /* ============ 시트 / 모달 ============ */
  .sheet-wrap{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;
    background:var(--scrim);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  .modal-wrap,.pin-wrap{backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  .sheet{width:100%;max-width:560px;max-height:92vh;background:var(--surface);border-radius:26px 26px 0 0;
    display:flex;flex-direction:column;overflow:hidden;animation:up .24s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(18px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-h{flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;padding:20px 20px 13px;
    border-bottom:1px solid var(--line)}
  .sheet-h h3{margin:0;font-size:18px;font-weight:900;letter-spacing:-.04em;color:var(--ink);line-height:1.3}
  .sheet-h p{margin:4px 0 0;font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:-.02em;line-height:1.5}
  .sheet-x{margin-left:auto;flex:0 0 auto;width:34px;height:34px;border-radius:12px;background:var(--surface-2);
    display:grid;place-items:center;font-size:14px;color:var(--muted)}
  .sheet-b{flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px 20px 12px;display:flex;flex-direction:column;gap:14px}
  .sheet-f{flex:0 0 auto;display:flex;gap:8px;padding:12px 20px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);background:var(--surface)}
  .btn{flex:1 1 0;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:900;letter-spacing:-.02em}
  .btn-navy{background:var(--accent);color:var(--on-accent)}
  .btn-navy:active{transform:scale(.99)}
  .btn-ghost{background:var(--surface-2);color:var(--ink-2);flex:0 0 auto;padding:0 18px}
  .btn-danger{background:var(--red-soft);color:var(--red);flex:0 0 auto;padding:0 18px}
  .btn-red{background:var(--red);color:#fff}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .frow .fld{min-width:0}
  .fld{display:flex;flex-direction:column;gap:6px}
  .fld-l{font-size:12.5px;font-weight:800;color:var(--ink-2);letter-spacing:-.02em}
  .fld input[type=text],.fld input[type=date],.fld textarea,.fld select{
    width:100%;background:var(--surface-2);border:1.5px solid transparent;border-radius:13px;
    padding:12px 14px;font-size:16px;font-weight:600;color:var(--ink);outline:none;
    letter-spacing:-.02em;line-height:1.45;appearance:none;-webkit-appearance:none}
  .fld textarea{resize:vertical;min-height:76px}
  .fld input::placeholder,.fld textarea::placeholder{color:var(--faint);font-weight:600}
  .fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--accent);background:var(--surface)}
  .fld select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;background-size:5px 5px,5px 5px;
    background-repeat:no-repeat;padding-right:36px}
  .starrow{display:flex;gap:6px}
  .st{width:42px;height:42px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;
    font-size:19px;color:var(--faint);line-height:1}
  .st.on{background:var(--brand-soft);color:var(--star)}
  .listbox{display:flex;flex-direction:column;gap:8px}
  .lrow{position:relative;background:var(--surface-2);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:6px}
  .lrow .lf{display:flex;flex-direction:column;gap:3px}
  .lrow .lc{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:-.02em}
  .lrow input,.lrow textarea{width:100%;background:var(--surface);border:1.5px solid transparent;border-radius:11px;
    padding:9px 11px;font-size:16px;font-weight:600;color:var(--ink);outline:none;letter-spacing:-.02em;line-height:1.4}
  .lrow input:focus,.lrow textarea:focus{border-color:var(--accent)}
  .lrow textarea{resize:vertical;min-height:54px}
  .lrow-x{position:absolute;top:8px;right:9px;width:26px;height:26px;border-radius:9px;background:var(--surface);
    display:grid;place-items:center;font-size:11px;color:var(--muted)}
  .addrow{height:44px;border-radius:13px;background:var(--surface-2);border:1.5px dashed var(--faint);color:var(--accent);
    font-size:13.5px;font-weight:800;display:flex;align-items:center;justify-content:center;letter-spacing:-.02em}
  .modal-wrap{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:22px;background:var(--scrim)}
  .modal{width:100%;max-width:340px;background:var(--surface);border-radius:24px;padding:24px 22px 18px;
    display:flex;flex-direction:column;gap:10px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:pop .18s}
  @keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:none;opacity:1}}
  .modal h3{margin:0;font-size:17px;font-weight:900;letter-spacing:-.035em;color:var(--ink);text-align:center}
  .modal p{margin:0;font-size:14px;font-weight:600;color:var(--ink-2);line-height:1.6;text-align:center;letter-spacing:-.02em}
  .modal .mrow{display:flex;gap:8px;margin-top:8px}
  .modal .mrow .btn{height:48px;border-radius:14px;font-size:14.5px}

  /* PIN */
  .pin-wrap{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:22px;background:var(--scrim)}

    box-shadow:0 24px 60px rgba(0,0,0,.35);animation:pop .18s}
  .pin-fl{width:56px;height:56px;margin:0 auto;border-radius:18px;background:var(--brand);display:grid;place-items:center;font-size:28px;line-height:1}
  .pin-t{margin:12px 0 0;font-size:22px;font-weight:900;letter-spacing:-.04em;color:var(--ink);line-height:1.2}
  .pin-s{margin:6px 0 0;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:-.02em}
  .pin-dots{display:flex;justify-content:center;gap:14px;margin:20px 0 0;height:16px}
  .pin-dot{width:14px;height:14px;border-radius:50%;background:var(--surface-3);transition:transform .12s,background .12s}
  .pin-dot.on{background:var(--accent);transform:scale(1.08)}
  .pin-msg{margin:10px 0 0;min-height:18px;font-size:13px;font-weight:700;color:var(--red);letter-spacing:-.02em}
  .pin-msg.ok{color:var(--green)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px}
  .key{height:54px;border-radius:16px;background:var(--surface-2);color:var(--ink);font-size:22px;font-weight:700;
    display:grid;place-items:center;transition:transform .1s,background .15s}
  .key:active{transform:scale(.95);background:var(--surface-3)}
  .key.ghost{background:transparent;color:var(--muted);font-size:16px}
  .pin-x{margin-top:12px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:-.02em;padding:8px 12px}
  .shake{animation:shake .34s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

  /* ============ 임장 도장 ============ */
  .stamps{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .stamp{display:inline-flex;align-items:center;gap:5px;border:2px solid var(--stamp);border-radius:10px;
    padding:3px 8px 3px 6px;color:var(--stamp);background:color-mix(in srgb,var(--stamp) 7%,transparent);transform:rotate(-4deg)}
  .stamp .si{border:1px solid color-mix(in srgb,var(--stamp) 50%,transparent);border-radius:7px;padding:2px 7px;display:flex;align-items:baseline;gap:4px}
  .stamp b{font-size:13px;font-weight:900;letter-spacing:-.03em;line-height:1.15}
  .stamp i{font-style:normal;font-size:10.5px;font-weight:800;opacity:.85;letter-spacing:-.01em}
  .stamp .paw{font-size:14px;line-height:1}
  .stamp-btn{height:36px;border-radius:12px;background:var(--surface);border:1.5px dashed var(--faint);color:var(--muted);
    font-size:12.5px;font-weight:800;padding:0 13px;letter-spacing:-.02em;display:inline-flex;align-items:center;gap:5px}
  .stamp-btn.on{border-style:solid;border-color:var(--stamp);color:var(--stamp);background:color-mix(in srgb,var(--stamp) 8%,var(--surface))}
  .cx-visit{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cx-visit .cnt{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:-.03em}
  .cx-visit .cnt b{color:var(--accent)}

  /* ============ 매물 · 자금 세팅 ============ */
  .lsts{display:flex;flex-direction:column;gap:8px}
  .lst{background:var(--surface);border-radius:15px;padding:13px 13px;display:flex;flex-direction:column;gap:9px;
    border:1px solid var(--line)}
  .lst-h{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
  .lst-n{display:block;font-size:14.5px;font-weight:900;color:var(--ink);letter-spacing:-.035em;line-height:1.35}
  .lst-loc{display:block;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:-.02em;margin-top:2px}
  .lstspec{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}
  .lstspec .sp .k{font-size:11px}
  .lstspec .sp .v{font-size:13px}
  .seed{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}
  .seed-h{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:2px}
  .seed-h .t{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:-.02em}
  .seed-h .pill{font-size:11px;padding:2px 8px}
  .srow{display:flex;align-items:baseline;gap:6px}
  .srow .k{flex:0 0 auto;width:38px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:-.03em}
  .srow .v{flex:1 1 auto;font-size:14px;font-weight:800;color:var(--ink);letter-spacing:-.03em}
  .srow .x{flex:0 0 auto;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:-.02em}
  .srow.loan .v{color:var(--accent)}
  .srow.cap .v{color:var(--green)}
  .srow.red .v{color:var(--red)}
  .srow.fee .k{width:60px}
  .srow hr{display:none}
  .sdiv{height:1px;background:var(--line);margin:2px 0}
  .total{display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:linear-gradient(150deg,var(--hero-a),var(--hero-b));color:#fff;border-radius:13px;padding:12px 14px}
  .total .tk{font-size:12px;font-weight:800;color:var(--hero-lo);letter-spacing:-.02em;line-height:1.3}
  .total .tk span{display:block;font-size:10.5px;font-weight:600;color:#ABA7E8;letter-spacing:-.01em;margin-top:1px}
  .total .tv{font-size:19px;font-weight:900;letter-spacing:-.045em;color:var(--hero-hi)}
  .warnline{font-size:12px;font-weight:700;color:var(--red);background:var(--red-soft);border-radius:10px;padding:8px 10px;
    letter-spacing:-.02em;line-height:1.45}
  .lst-empty{font-size:12.5px;font-weight:600;color:var(--faint);background:var(--surface);border:1.5px dashed var(--line);
    border-radius:12px;padding:11px 12px;letter-spacing:-.02em}

  /* ============ 지도 이미지 ============ */
  .mapimg{display:block;width:100%;border-radius:14px;overflow:hidden;background:var(--surface-2);
    border:0;padding:0;line-height:0;position:relative}
  .mapimg img{width:100%;height:auto;display:block}
  .mapimg .mapcap{display:block;line-height:1.3;font-size:11.5px;font-weight:800;color:#fff;letter-spacing:-.02em;
    background:rgba(30,27,122,.78);padding:7px 11px;text-align:left}
  .mapimg .ph{display:grid;place-items:center;height:100px;font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.5}
  .imgrow{display:flex;gap:7px}
  .imgrow .addrow{flex:1 1 auto}
  .imgrow .drop{flex:0 0 auto;height:44px;padding:0 15px;border-radius:13px;background:var(--red-soft);color:var(--red);
    font-size:13px;font-weight:800;display:grid;place-items:center;letter-spacing:-.02em}
  .bigmap-wrap{position:fixed;inset:0;z-index:95;background:rgba(12,10,4,.95);display:flex;align-items:flex-start;
    justify-content:center;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pinch-zoom}
  .bigmap-wrap img{display:block;width:100%;height:auto;flex:0 0 auto;transition:width .18s ease}
  .bigmap-wrap.zoom img{width:240%}
  .bigmap-wrap.zoom{align-items:flex-start}
  .bigmap-x{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:14px;width:40px;height:40px;border-radius:13px;
    background:rgba(255,255,255,.95);color:#1E1B7A;font-size:15px;display:grid;place-items:center;
    box-shadow:0 6px 16px rgba(0,0,0,.35)}
  .bigmap-z{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);height:38px;padding:0 15px;
    border-radius:999px;background:rgba(255,255,255,.95);color:#1E1B7A;font-size:12.5px;font-weight:800;
    letter-spacing:-.02em;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.3)}
  .bigmap-cap{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom) + 19px);
    font-size:12px;font-weight:700;color:#EFEBFF;background:rgba(255,255,255,.16);padding:7px 12px;border-radius:999px;
    letter-spacing:-.02em;white-space:nowrap}

  /* ============ 시트 안 계산기 ============ */
  .fld-head{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;font-weight:900;color:var(--accent);
    letter-spacing:-.03em}
  .fld-head::after{content:"";flex:1 1 auto;height:1px;background:var(--line)}
  .fld .hint{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:-.02em;line-height:1.45}
  .fld .hint b{color:var(--accent)}
  .pchips{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .pch{height:42px;border-radius:12px;background:var(--surface-2);font-size:13px;font-weight:800;color:var(--ink-2);
    letter-spacing:-.03em;display:grid;place-items:center;border:1.5px solid transparent}
  .pch.on{background:var(--surface);border-color:var(--accent);color:var(--accent)}
  .livebox{background:var(--surface-2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
  .livebox .lr{display:flex;align-items:baseline;justify-content:space-between;gap:6px}
  .livebox .lr .k{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:-.02em}
  .livebox .lr .v{font-size:14.5px;font-weight:800;color:var(--ink);letter-spacing:-.03em}
  .livebox .lr.big{margin-top:3px;padding-top:9px;border-top:1px dashed var(--faint)}
  .livebox .lr.big .k{color:var(--accent);font-size:13px;font-weight:800}
  .livebox .lr.big .v{color:var(--accent);font-size:18px}
  .livebox .note{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:-.02em;line-height:1.45}

  #toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));z-index:120;
    transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:700;
    padding:12px 18px;border-radius:999px;max-width:88vw;text-align:center;letter-spacing:-.02em;
    opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;box-shadow:0 12px 28px rgba(0,0,0,.28)}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:#8C2B24;color:#fff}
  /* 메모 시트처럼 아래를 가리는 팝업이 열려 있으면 알림은 위로 */
  #toast.lift{bottom:auto;top:calc(16px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-8px)}
  #toast.lift.on{transform:translateX(-50%) translateY(0)}
</style>
</head>

  <header class="top">

<script>
(function(){
'use strict';

/* ================== 상수 ================== */
var DB = 'https://bubulife-678ac-default-rtdb.firebaseio.com';

function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function deep(o){ return JSON.parse(JSON.stringify(o || {})); }
function getP(o, path){
  var parts = path.split('.'), cur = o;
  for(var i=0;i<parts.length;i++){
    if(cur == null || typeof cur !== 'object') return undefined;
    cur = cur[parts[i]];
  }
  return cur;
}
function setP(o, path, v){
  var parts = path.split('.'), cur = o;
  for(var i=0;i<parts.length-1;i++){
    var k = parts[i];
    if(cur[k] == null || typeof cur[k] !== 'object') cur[k] = {};
    cur = cur[k];
  }
  cur[parts[parts.length-1]] = v;
}
function fmtDate(s){
  if(!s) return '';
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s));
  return m ? (m[1] + '.' + m[2] + '.' + m[3]) : String(s);
}
function starsHTML(n){
  n = Math.max(0, Math.min(5, parseInt(n || 0, 10) || 0));
  var out = '';
  for(var i=1;i<=5;i++) out += '<span' + (i<=n ? '' : ' class="off"') + '>★</span>';
  return '<span class="stars">' + out + '</span>';
}
function safeUrl(u){
  u = String(u || '').trim();
  return /^https?:\/\//i.test(u) ? u : '';
}

/* ---------- 금액 ---------- */
function num(v){
  var n = Number(String(v == null ? '' : v).replace(/[^\d.-]/g, ''));
  return isFinite(n) ? Math.round(n) : 0;
}
/* '12억 5,000' · '12억5000' · '125000' · '12.5억' · '예시 · 12억 5,000만' 을 모두 만원 단위 숫자로 */
function parseMoney(v){
  var s = String(v == null ? '' : v).replace(/[\s,]/g, '').replace(/원/g, '');
  if(!s) return 0;
  var m = /(\d+(?:\.\d+)?)억(\d+(?:\.\d+)?)?/.exec(s);
  if(m){
    var eok = parseFloat(m[1]) || 0;
    var rest = m[2] ? parseFloat(m[2]) : 0;
    return Math.round(eok * 10000 + rest);
  }
  m = /(\d+(?:\.\d+)?)만/.exec(s);
  if(m) return Math.round(parseFloat(m[1]));
  m = /(\d[\d.]*)/.exec(s);
  return m ? Math.round(parseFloat(m[1].replace(/\.$/, '')) || 0) : 0;
}
function cleanText(v){
  return String(v == null ? '' : v).replace(/^\s*예시\s*·\s*/, '').trim();
}
function fmtMoney(v){
  v = Math.round(Number(v) || 0);
  if(!v) return '—';
  var neg = v < 0;
  if(neg) v = -v;
  var eok = Math.floor(v / 10000), man = v % 10000, out = '';
  if(eok) out += eok.toLocaleString('ko-KR') + '억';
  if(man) out += (out ? ' ' : '') + man.toLocaleString('ko-KR') + '만';
  return (neg ? '-' : '') + (out || '0');
}
function fmtWon(v){
  return fmtMoney(v) + (v ? '원' : '');
}
function manToEokText(v){
  return v ? fmtMoney(v) : '';
}

var PRESETS = [
  { k:'ltv70', t:'생초 LTV 70%', r:0.70 },
  { k:'ltv40', t:'LTV 40%', r:0.40 },
  { k:'gap', t:'전세 끼고(갭)', r:0 },
  { k:'manual', t:'직접입력', r:null }
];
function presetOf(k){
  for(var i=0;i<PRESETS.length;i++) if(PRESETS[i].k === (k || 'manual')) return PRESETS[i];
  return PRESETS[3];
}
/* 취득세 간이 계산 (1주택 6억↓1.1% / 6~9억 누진 / 9억↑3.5%, 다주택 8%·12%) */
function acqTax(priceMan, houses){
  var p = priceMan * 10000;
  if(!p) return 0;
  var h = String(houses || '1');
  var rate, edu, agri;
  if(h === '3'){ rate = 0.12; edu = 0.004; agri = 0.002; }
  else if(h === '2'){ rate = 0.08; edu = 0.004; agri = 0.002; }
  else {
    if(p <= 600000000){ rate = 0.01; edu = 0.001; agri = 0; }
    else if(p <= 900000000){ rate = ((p / 100000000) * 2 / 3 - 3) / 100; edu = 0.003; agri = 0.002; }
    else { rate = 0.03; edu = 0.003; agri = 0.002; }
  }
  return Math.round(priceMan * (rate + edu + agri));
}
function acqRateText(priceMan, houses){
  var p = priceMan * 10000, h = String(houses || '1'), r;
  if(h === '3') r = 12.6; else if(h === '2') r = 8.6;
  else if(p <= 600000000) r = 1.1;
  else if(p <= 900000000) r = Math.round((((p / 100000000) * 2 / 3 - 3) + 0.5) * 100) / 100;
  else r = 3.5;
  return r;
}
function seedOf(L){
  L = L || {};
  var price = num(L.maemae), jeon = num(L.jeonse);
  var pre = presetOf(L.preset);
  var loan, note = '';
  if(pre.r != null) loan = price * pre.r;
  else loan = num(L.loan);
  var cap = num(L.loanCap);
  if(cap > 0 && loan > cap){ loan = cap; note = '한도'; }
  var room = price > 0 ? Math.max(0, price - jeon) : 0;
  if(price > 0 && loan > room){ loan = room; note = note ? '한도·갭' : '갭'; }
  loan = Math.max(0, Math.round(loan));
  var capital = price - jeon - loan;

  var rate = Number(L.rate) > 0 ? Number(L.rate) : 5;
  var term = Number(L.term) > 0 ? Number(L.term) : 30;
  var mInt = Math.round(loan * (rate / 100) / 12);
  var mr = rate / 1200, mn = Math.round(term * 12);
  var mPay = loan ? Math.round(loan * mr / (1 - Math.pow(1 + mr, -mn))) : 0;

  var feeRate = (L.feeRate === undefined || L.feeRate === null || L.feeRate === '') ? 0.55 : Number(L.feeRate);
  var fee = (L.fee === undefined || L.fee === null || L.fee === '') ? Math.round(price * feeRate / 100) : Math.round(Number(L.fee));

  var houses = L.houses || '1';
  var taxAuto = acqTax(price, houses);
  var tax = (L.tax === undefined || L.tax === null || L.tax === '') ? taxAuto : Math.round(Number(L.tax));

  return {
    price: price, jeon: jeon, loan: loan, capital: capital,
    rate: rate, term: term, mInt: mInt, mPay: mPay, note: note,
    feeRate: feeRate, fee: fee, tax: tax, taxAuto: taxAuto, houses: houses,
    total: capital + fee + tax, preset: pre
  };
}

function imgNodeUrl(id){ return DB + '/rooms/' + ROOM + '-img/' + encodeURIComponent(id) + '.json'; }
function ensureMapImg(id, ts){
  var c = imgCache[id];

  if(c && c.loading) return;
  imgCache[id] = { ts: ts, data: (c && c.data) || '', loading: true };

  });
}
function compressImage(file, done, fail){
  var tries = [[1400, 0.82], [1100, 0.72], [900, 0.62]];
  var url = URL.createObjectURL(file);
  var img = new Image();
  img.onload = function(){
    var w = img.naturalWidth || 1200, h = img.naturalHeight || 900;
    var i = 0;
    var step = function(){
      var maxW = tries[i][0], q = tries[i][1];
      var scale = Math.min(1, maxW / w);
      var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
      var cv = document.createElement('canvas');
      cv.width = cw; cv.height = ch;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch);
      ctx.drawImage(img, 0, 0, cw, ch);
      var data = cv.toDataURL('image/jpeg', q);
      i++;
      if(data.length > 800000 && i < tries.length) return step();
      URL.revokeObjectURL(url);
      done(data, cw, ch);
    };
    step();
  };
  img.onerror = function(){
    URL.revokeObjectURL(url);
    if(fail) fail(new Error('image'));
  };
  img.src = url;
}

function normalize(data){
  data = data || {};
  S.meta = data.meta || {};
  S.checklist = data.checklist || {};
  var regs = {};
  if(data.regions && typeof data.regions === 'object'){
    Object.keys(data.regions).forEach(function(id){
      var r = data.regions[id];
      if(r && typeof r === 'object'){ r = deep(r); r.id = id; regs[id] = r; }
    });
  }
  S.regions = regs;
}
function regionList(){
  return Object.keys(S.regions).map(function(id){ return S.regions[id]; }).sort(function(a,b){
    var da = a.date || '', db = b.date || '';
    if(da !== db) return da < db ? 1 : -1;
    return String(a.name || '').localeCompare(String(b.name || ''));
  });
}

function api(path, method, body){
  var opt = { method: method || 'GET', cache:'no-store', headers:{ 'Content-Type':'application/json' } };
  if(body !== undefined) opt.body = JSON.stringify(body);
  return fetch(nodeUrl(path), opt).then(function(r){
    if(!r.ok) throw new Error('http ' + r.status);
    return r.status === 204 ? null : r.json();
  });
}
function refresh(force){
  if(!force && (sheetOpen || Date.now() - lastWrite < 2500)){ return Promise.resolve(); }
  return fetch(roomUrl(), { cache:'no-store' }).then(function(r){
    if(!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }).then(function(data){
    normalize(data);
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }catch(e){}
    dotEl.className = 'dot live';
    render();
  }).catch(function(){ dotEl.className = 'dot warn'; });
}
function loadCache(){
  try{
    var raw = localStorage.getItem(CACHE_KEY);
    if(raw) normalize(JSON.parse(raw));
  }catch(e){}
}
function queueRefresh(){
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(function(){ refresh(false); }, 450);
}
function startSync(){
  try{
    es = new EventSource(roomUrl());
    var on = function(){ queueRefresh(); };
    es.addEventListener('put', on);
    es.addEventListener('patch', on);
    es.addEventListener('keep-alive', function(){ dotEl.className = 'dot live'; });
    es.onopen = function(){ dotEl.className = 'dot live'; };
    es.onerror = function(){
      dotEl.className = 'dot warn';
      if(es){ es.close(); es = null; }
    };
  }catch(e){ dotEl.className = 'dot warn'; }
  pollTimer = setInterval(function(){
    if(document.visibilityState === 'visible') refresh(false);
  }, 15000);
}

  lockBtn.textContent = unlocked ? '✏️' : '🔒';
  lockBtn.classList.toggle('on', unlocked);
  lockBtn.setAttribute('aria-label', unlocked ? '기록 모드 끄기(잠그기)' : '기록 모드 켜기');
}

function emptyCard(inner){
  return '<section class="card empty-card"><div class="ef">👣</div>' + inner + '</section>';
}

function chip(key, label){
  return '<button class="fchip' + (filter === key ? ' on' : '') + '" data-act="filter" data-f="' + key + '">' + label + '</button>';
}

function renderHome(){
  var list = regionList();
  var done = list.filter(function(r){ return r.status === 'done'; }).length;
  var planned = list.length - done;
  var star4 = list.filter(function(r){ return (parseInt(r.stars,10)||0) >= 4; }).length;
  var cx = list.reduce(function(a,r){ return a + (r.complexes ? r.complexes.length : 0); }, 0);
  var shown = list.filter(function(r){
    if(filter === 'done') return r.status === 'done';
    if(filter === 'plan') return r.status !== 'done';
    if(filter === 'star') return (parseInt(r.stars,10)||0) >= 4;
    return true;
  });

  var html = '';
  html += '<section class="hero">';
  html += '<div class="hero-top">👣 ' + esc(S.meta.tagline || '훨훨처럼 살고 싶은 부부의 임장노트') + '</div>';
  html += '<div class="hero-main">임장 <b>' + list.length + '곳</b> 기록 중</div>';
  html += '<div class="hero-sub">완료 ' + done + ' · 예정 ' + planned + ' · 단지 ' + cx + '개 정리</div>';
  html += '</section>';

  if(list.length){
    html += '<div class="chips-row">' + chip('all','전체 ' + list.length) + chip('done','임장 완료 ' + done)
      + chip('plan','임장 예정 ' + planned) + chip('star','★ 4+ ' + star4) + '</div>';
  }

  if(!list.length){
    html += emptyCard('<h2>아직 기록한 지역이 없어요</h2><p>'
      + (unlocked ? '아래 <b>＋ 새 지역</b> 버튼으로 첫 임장노트를 만들어 보세요.'
                  : '임장 다녀온 지역이 이곳에 하나씩 쌓입니다.') + '</p>');
  } else if(!shown.length){
    html += emptyCard('<h2>조건에 맞는 지역이 없어요</h2><p>위 필터를 <b>전체</b>로 바꿔 보세요.</p>');
  } else {
    html += shown.map(regionCard).join('');
  }

  if(list.length <= 2){
    html += '<section class="card guide"><div class="card-h"><h2>임장노트는 이렇게 쌓여요</h2><span class="pill">5단계</span></div>'
      + '<div class="g5">'
      + [['🎬','브리핑'],['🗺️','루트'],['🏙️','입지'],['🏢','단지'],['💬','총평']].map(function(x){
          return '<div class="gi"><span>' + x[0] + '</span>' + x[1] + '</div>';
        }).join('')
      + '</div></section>';
  }

  if(unlocked){
    html += '<button class="add-btn" data-act="add-region">＋ 새 지역 임장노트</button>';
  }
  html += '<p class="foot-note">유튜브 브리핑 → 루트 → 입지 → 단지 → 인터뷰<br>순서로 쌓이는 임장노트</p>';
  viewEl.innerHTML = html;
}

function regionCard(r){
  var id = r.id;
  var status = r.status === 'done'
    ? '<span class="pill green">임장 완료</span>'
    : '<span class="pill navy">임장 예정</span>';
  var html = '<button class="card rcard" data-act="open" data-id="' + esc(id) + '">';
  html += '<div class="rc-top"><h2 class="rc-name">' + esc(r.name || '이름 없는 지역') + '</h2>' + status + '</div>';
  html += '<div class="rc-meta"><span>' + esc(fmtDate(r.date) || '날짜 미정') + '</span>' + starsHTML(r.stars);
  if(r.sample) html += '<span class="pill">예시</span>';
  html += '</div>';
  if(r.summary && r.summary.complex) html += '<div class="rc-key">' + esc(r.summary.complex) + '</div>';
  if(r.summary && r.summary.price) html += '<div class="rc-price">' + esc(r.summary.price) + '</div>';
  if(r.tagline) html += '<p class="rc-tag">“' + esc(r.tagline) + '”</p>';
  html += '<div class="rc-foot"><span>단지 ' + ((r.complexes || []).length) + '개</span>'
    + (function(){
        var list2 = r.complexes || [];
        if(!list2.length) return '';
        var v = list2.filter(function(c){ return c && c.visit; }).length;
        return '<span>·</span><span>👣 ' + v + '/' + list2.length + '단지</span>';
      })()
    + '<span>·</span><span>'
    + esc((r.talk && r.talk.verdict && r.talk.verdict.rank) || '순위 미정') + '</span><span class="arrow">›</span></div>';
  html += '</button>';
  return html;
}

function pen(act, id, extra){
  return unlocked ? '<button class="pen" data-act="' + act + '" data-id="' + esc(id) + '"'
    + (extra || '') + ' aria-label="수정">✏️</button>' : '';
}

function renderDetail(id){
  var r = S.regions[id];
  if(!r){
    viewEl.innerHTML = '<button class="back" data-act="back">← 임장노트</button>'
      + emptyCard('<h2>없는 노트예요</h2><p>삭제되었거나 주소가 달라졌어요.</p>');
    return;
  }
  var status = r.status === 'done'
    ? '<span class="pill green">임장 완료</span>'
    : '<span class="pill navy">임장 예정</span>';

  var html = '<button class="back" data-act="back">← 임장노트</button>';

  /* 헤더 */
  html += '<section class="card dhead">';
  html += '<div class="dh-top"><div style="min-width:0"><div class="ov-lab">📌 기본 개요</div><h2 class="dh-name">'
    + esc(r.name || '이름 없는 지역')
    + (r.sample ? ' <span class="pill">예시</span>' : '') + '</h2></div>' + status + '</div>';
  html += '<div class="dh-meta"><span>' + esc(fmtDate(r.date) || '날짜 미정') + '</span>' + starsHTML(r.stars) + '</div>';
  if(r.tagline) html += '<p class="dh-tag">“' + esc(r.tagline) + '”</p>';
  html += '<div class="dh-sum">';
  if(r.summary && r.summary.complex) html += '<div class="rowline"><span class="k">핵심 단지</span><span class="v"><b>' + esc(r.summary.complex) + '</b></span></div>';
  if(r.summary && r.summary.price) html += '<div class="rowline"><span class="k">매매·전세</span><span class="v">' + esc(r.summary.price) + '</span></div>';
  if(r.summary && r.summary.gap) html += '<div class="rowline green"><span class="k">갭</span><span class="v"><b>' + esc(r.summary.gap) + '</b></span></div>';
  var goalBits = [];
  if(r.summary && r.summary.budget) goalBits.push('예산 ' + r.summary.budget);
  if(r.summary && r.summary.area) goalBits.push(r.summary.area);
  if(goalBits.length) html += '<div class="rowline"><span class="k">목표</span><span class="v"><b>' + esc(goalBits.join(' · ')) + '</b></span></div>';
  if(r.route && r.route.line) html += '<div class="rowline stack"><span class="k">임장 루트</span><span class="v">' + esc(r.route.line) + '</span></div>';
  var cxAll = r.complexes || [];
  if(cxAll.length){
    var cxVisit = cxAll.filter(function(c){ return c && c.visit; }).length;
    html += '<div class="rowline"><span class="k">임장 도장</span><span class="v"><b>👣 방문 ' + cxVisit + ' / ' + cxAll.length + '단지</b>'
      + (cxVisit ? '' : ' <span class="muted">아직 도장 없음</span>') + '</span></div>';
  }
  html += '</div>';
  if(unlocked){
    html += '<div class="dh-act"><button class="mini-btn" data-act="edit-region" data-id="' + esc(id) + '">기본 정보 수정</button>'
      + '<button class="mini-btn danger" data-act="del-region" data-id="' + esc(id) + '">삭제</button></div>';
  }
  html += '</section>';

  html += secYt(r, id);
  html += secRoute(r, id);
  html += secPlace(r, id);
  html += secCx(r, id);
  html += secTalk(r, id);
  html += '<p class="foot-note">' + esc(fmtDate(r.date) || '') + ' 임장 기록 · 리훨 임챌</p>';
  viewEl.innerHTML = html;
}

function secYt(r, id){
  var y = r.yt || {};
  var html = '<section class="card"><div class="card-h"><h2>🎬 유튜브 브리핑 정리</h2>' + pen('edit-yt', id) + '</div>';
  var url = safeUrl(y.url);
  if(url){
    html += '<a class="go" href="' + esc(url) + '" target="_blank" rel="noopener"><span class="gi">▶</span>'
      + '<span>' + esc(y.title || '브리핑 영상') + '</span><span class="gx">열기 ↗</span></a>';
  } else if(y.title){
    html += '<div class="rowline"><span class="v"><b>' + esc(y.title) + '</b></span></div>';
  }
  if(y.watched) html += '<p class="cap-l">본 날짜 ' + esc(fmtDate(y.watched)) + '</p>';
  var pts = (y.points || []).filter(function(p){ return (p && (p.k || p.v)); });
  if(pts.length){
    html += '<ul class="pts">' + pts.map(function(p){
      return '<li><span class="k">' + esc(p.k || '포인트') + '</span><span class="v">' + esc(p.v) + '</span></li>';
    }).join('') + '</ul>';
  }
  if(!url && !y.title && !pts.length) html += '<p class="empty-line">아직 브리핑을 정리하지 않았어요.</p>';
  return html + '</section>';
}

function secRoute(r, id){
  var o = r.route || {};
  var html = '<section class="card"><div class="card-h"><h2>🗺️ 임장 루트 &amp; 지도</h2>' + pen('edit-route', id) + '</div>';
  if(o.line) html += '<p class="quote">' + esc(o.line) + '</p>';

  /* 지도 이미지 — 첨부했으면 바로 보이고, 탭하면 크게 */
  var ts = Number(o.mapImg) || 0;
  if(ts){
    var c = imgCache[id];
    if(!c || (c.ts !== ts && !c.loading)) ensureMapImg(id, ts);
    html += '<button class="mapimg" data-act="open-map" data-id="' + esc(id) + '" aria-label="지도 크게 보기">';
    if(c && c.data){
      html += '<img src="' + c.data + '" alt="임장 지도">';
    } else {
      html += '<span class="ph">' + (c && c.err ? '지도를 불러오지 못했어요 — 탭해서 다시 시도' : '지도를 불러오는 중…') + '</span>';
    }
    html += '<span class="mapcap">🗺️ 지도 탭해서 크게 보기</span></button>';
  }

  var url = safeUrl(o.map);
  var nvHref = url || ('https://map.naver.com/p/search/' + encodeURIComponent(r.name || ''));
  if(nvHref && nvHref !== 'https://map.naver.com/p/search/'){
    html += '<a class="mapbtn" href="' + esc(nvHref) + '" target="_blank" rel="noopener"><span class="mg">🗺️</span>'
      + '<span class="mt">네이버지도 열기</span><span class="mx">' + (url ? '저장한 링크' : '지역명으로 검색') + ' ↗</span></a>';
  }

  if(unlocked){
    html += '<div class="imgrow"><button class="addrow" data-act="pick-map" data-id="' + esc(id) + '">📷 '
      + (ts ? '지도 사진 교체' : '지도 사진 첨부') + '</button>'
      + (ts ? '<button class="drop" data-act="drop-map" data-id="' + esc(id) + '">삭제</button>' : '') + '</div>';
    html += '<p class="cap-l">폰 갤러리에서 고르면 자동으로 줄여서 저장해요 (가로 1400px JPEG)</p>';
  }

  var steps = (o.steps || []).filter(function(s){ return s && (s.place || s.memo); });
  if(steps.length){
    html += '<ol class="steps2">' + steps.map(function(s, i){
      return '<li><span class="n">' + (i+1) + '</span><span class="t"><span class="p">' + esc(s.place || '이동')
        + '</span>' + (s.how ? '<span class="h">' + esc(s.how) + '</span>' : '')
        + (s.memo ? '<span class="m">' + esc(s.memo) + '</span>' : '') + '</span></li>';
    }).join('') + '</ol>';
  }
  if(o.notes) html += '<p class="memo">' + esc(o.notes) + '</p>';
  if(!o.line && !url && !ts && !steps.length && !o.notes) html += '<p class="empty-line">아직 루트를 정리하지 않았어요.</p>';
  return html + '</section>';
}

function secPlace(r, id){
  var p = r.place || {};
  var html = '<section class="card"><div class="card-h"><h2>🏙️ 입지 · 동네 요약</h2>' + pen('edit-place', id) + '</div>';
  var rows = [
    ['교통·일자리', p.transport],
    ['학군', p.school],
    ['상권', p.market],
    ['재건축·재개발', p.redev]
  ].filter(function(x){ return x[1]; });
  if(rows.length){
    html += rows.map(function(x){
      return '<div class="rowline stack"><span class="k">' + x[0] + '</span><span class="v">' + esc(x[1]) + '</span></div>';
    }).join('');
  }
  if(p.impression) html += '<p class="quote green">' + esc(p.impression) + '</p>';
  if(!rows.length && !p.impression) html += '<p class="empty-line">아직 입지 요약이 없어요.</p>';
  return html + '</section>';
}

function stampHTML(visit){
  return '<span class="stamp"><span class="paw">👣</span><span class="si"><b>임장 완료</b><i>'
    + esc(fmtDate(visit)) + '</i></span></span>';
}

function secCx(r, id){
  var list = r.complexes || [];
  var visited = list.filter(function(c){ return c && c.visit; }).length;
  var html = '<section class="card"><div class="card-h"><h2>🏢 단지별 카드</h2>'
    + (list.length ? '<span class="pill' + (visited ? ' navy' : '') + '">👣 방문 ' + visited + ' / ' + list.length + '단지</span>' : '')
    + '</div>';
  if(!list.length) html += '<p class="empty-line">아직 단지를 추가하지 않았어요.</p>';
  list.forEach(function(c, i){
    html += '<div class="cx">';
    html += '<div class="cx-h"><h3>' + esc(c.name || ('단지 ' + (i+1))) + '</h3>';
    if(unlocked){
      html += '<span class="cx-act"><button class="pen" data-act="edit-cx" data-id="' + esc(id) + '" data-i="' + i + '" aria-label="단지 수정">✏️</button>'
        + '<button class="pen" data-act="del-cx" data-id="' + esc(id) + '" data-i="' + i + '" aria-label="단지 삭제">🗑</button></span>';
    }
    html += '</div>';
    var spec = [['세대수', c.households], ['준공', c.built], ['주차', c.parking], ['평형', c.area], ['용적률·건폐율', c.far]]
      .filter(function(x){ return x[1]; });
    if(spec.length){
      html += '<div class="spec">' + spec.map(function(x){
        return '<div class="sp"><span class="k">' + x[0] + '</span><span class="v">' + esc(x[1]) + '</span></div>';
      }).join('') + '</div>';
    }
    var prs = [['전고점', c.peak, ''], ['최근 실거래', c.deal, ''], ['현재 호가', c.asking, 'ask'], ['전세가', c.jeonse, 'jeon']]
      .filter(function(x){ return x[1]; });
    if(prs.length){
      html += '<div class="prs">' + prs.map(function(x){
        return '<div class="pr ' + x[2] + '"><span class="k">' + x[0] + '</span><span class="v">' + esc(x[1]) + '</span></div>';
      }).join('') + '</div>';
    }

    /* 👣 임장 도장 */
    html += '<div class="cx-visit">';
    if(c.visit) html += stampHTML(c.visit);
    if(unlocked){
      html += '<button class="stamp-btn' + (c.visit ? ' on' : '') + '" data-act="stamp" data-id="' + esc(id) + '" data-i="' + i + '"'
        + ' aria-pressed="' + (c.visit ? 'true' : 'false') + '">'
        + (c.visit ? '도장 지우기' : '👣 임장 도장') + '</button>';
    } else if(!c.visit){
      html += '<span class="cnt">아직 도장 없음</span>';
    }
    html += '</div>';

    if(c.memo) html += '<p class="memo">' + esc(c.memo) + '</p>';

    /* 네이버 지도 · 부동산 바로 열기 */
    if(c.name || c.naver || c.land){
      var nm = c.name || '';
      var mapHref = safeUrl(c.naver) || ('https://map.naver.com/p/search/' + encodeURIComponent(nm));
      var landHref = safeUrl(c.land) || ('https://m.land.naver.com/search/result/' + encodeURIComponent(nm));
      html += '<div class="maprow">'
        + '<a class="mapbtn sm" href="' + esc(mapHref) + '" target="_blank" rel="noopener"><span class="mg">🗺️</span><span class="mt">네이버지도</span></a>'
        + '<a class="mapbtn sm" href="' + esc(landHref) + '" target="_blank" rel="noopener"><span class="mg">🏢</span><span class="mt">네이버부동산</span></a>'
        + '</div>';
    }

    /* 매물별 자금 세팅 */
    var ls = c.listings || [];
    if(ls.length){
      html += '<div class="lsts">' + ls.map(function(L, k){ return listingHTML(L, id, i, k); }).join('') + '</div>';
    }
    if(unlocked){
      html += '<button class="addrow" data-act="add-lst" data-id="' + esc(id) + '" data-i="' + i + '">＋ 매물 · 자금 세팅 추가</button>';
    } else if(!ls.length){
      html += '<p class="lst-empty">아직 매물 세팅이 없어요.</p>';
    }
    html += '</div>';
  });
  if(unlocked) html += '<button class="addrow" data-act="add-cx" data-id="' + esc(id) + '">＋ 단지 추가</button>';
  return html + '</section>';
}

function listingHTML(L, id, ci, li){
  var s = seedOf(L);
  var name = L.name || '매물';
  var spec = [
    ['동·층향', L.dong], ['입주가능', L.moveIn],
    ['세대수(연식)', L.households],
    ['공시가격', L.gongsi ? fmtMoney(L.gongsi) : ''],
    ['시세', L.sise ? fmtMoney(L.sise) : ''], ['전고점', L.peak ? fmtMoney(L.peak) : ''],
    ['전세 호가', L.jeonseAsk ? fmtMoney(L.jeonseAsk) : ''], ['매매 호가', L.asking ? fmtMoney(L.asking) : '']
  ].filter(function(x){ return x[1]; });

  var html = '<div class="lst">';
  html += '<div class="lst-h"><span><b class="lst-n">' + esc(name) + '</b>'
    + (L.where ? '<span class="lst-loc">' + esc(L.where) + '</span>' : '') + '</span>';
  if(unlocked){
    html += '<span class="cx-act"><button class="pen" data-act="edit-lst" data-id="' + esc(id) + '" data-i="' + ci + '" data-k="' + li + '" aria-label="매물 수정">✏️</button></span>';
  }
  html += '</div>';
  if(spec.length){
    html += '<div class="lstspec">' + spec.map(function(x){
      return '<div class="sp"><span class="k">' + x[0] + '</span><span class="v">' + esc(x[1]) + '</span></div>';
    }).join('') + '</div>';
  }

  /* 자금 세팅 */
  html += '<div class="seed"><div class="seed-h"><span class="t">자금 세팅</span>'
    + '<span class="pill navy">' + esc(s.preset.t) + '</span></div>';
  html += '<div class="srow"><span class="k">매매</span><span class="v">' + fmtMoney(s.price) + '</span></div>';
  html += '<div class="srow"><span class="k">전세</span><span class="v">' + fmtMoney(s.jeon) + '</span></div>';
  html += '<div class="srow loan"><span class="k">대출</span><span class="v">' + fmtMoney(s.loan) + '</span>'
    + (s.loan ? '<span class="x">월 ' + s.mPay + '만 · 이자 ' + s.mInt + '만</span>' : '') + '</div>';
  html += '<div class="sdiv"></div>';
  html += '<div class="srow cap"><span class="k">자본</span><span class="v">' + fmtMoney(s.capital) + '</span>'
    + '<span class="x">초기투자금</span></div>';
  if(s.note) html += '<div class="srow"><span class="k"></span><span class="x">'
    + (s.note === '한도' ? '대출 한도 적용' : s.note === '갭' ? '전세 갑까지만 대출' : '한도·갑 적용') + '</span></div>';
  html += '</div>';

  /* 부대비용 */
  html += '<div class="seed"><div class="seed-h"><span class="t">부대비용</span>'
    + '<span class="pill">' + s.feeRate + '% · ' + acqRateText(s.price, s.houses) + '%</span></div>';
  html += '<div class="srow fee"><span class="k">중개보수</span><span class="v">' + fmtMoney(s.fee) + '</span></div>';
  html += '<div class="srow fee"><span class="k">취득세</span><span class="v">' + fmtMoney(s.tax) + '</span></div>';
  html += '</div>';

  if(s.capital < 0){
    html += '<p class="warnline">전세 + 대출이 매매가보다 커요. 대출금을 줄여 주세요.</p>';

    + '<b class="tv">' + (s.total < 0 ? '-' : '') + fmtMoney(Math.abs(s.total)) + '</b></div>';

      html += '<div class="vd-col bad"><h4>걸리는 점</h4><ul>' + (bad.length ? bad.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') : '<li>—</li>') + '</ul></div>';

    }
    if(v.rank) html += '<div class="rowline"><span class="k">매수 순위</span><span class="v"><b>' + esc(v.rank) + '</b></span></div>';

  sel: function(label, path, opts){

      getVal:function(d){ return getP(d, path) || opts[0][0]; },
      setVal:function(d, v){ setP(d, path, v); } };
  },
  head: function(label){
    return { label:label, type:'head',
      getVal:function(){ return ''; },
      setVal:function(){} };
  },
  stars: function(label, path){

function closeAll(){
  Array.prototype.forEach.call(document.querySelectorAll(OVERLAY_SEL), function(n){ n.remove(); });

/* ================== 안드로이드 뒤로가기 — 열린 팝업만 닫기 ==================
   시트·확인 모달·지도 확대 뷰어·잠금 해제 팝업을 열 때 히스토리를 하나 쌓고,
   뒤로가기(popstate)에서는 앱을 나가지 않고 열린 팝업만 닫는다. */
var OVERLAY_SEL = '.sheet-wrap,.modal-wrap,.pin-wrap,.bigmap-wrap';
var overlayHistPushed = false;   /* 팝업을 위해 쌓아 둔 히스토리 엔트리가 남아 있는지 */
var overlayHistUrl = '';         /* 쌓을 때의 주소 — 그 사이 해시 이동을 했는지 비교용 */
var overlaySelfBack = false;     /* 정리를 위해 우리가 부른 history.back() 표시 */
function anyOverlayOpen(){ return !!document.querySelector(OVERLAY_SEL); }
function pushOverlayHistory(){
  if(overlayHistPushed) return;
  try{
    history.pushState({ appModal: true }, '');
    overlayHistPushed = true;
    overlayHistUrl = location.href;
  }catch(e){}
}
function settleOverlayHistory(){
  if(!overlayHistPushed) return;
  setTimeout(function(){
    if(!overlayHistPushed) return;   /* 이미 정리됐거나 뒤로가기로 소비됨 */
    if(anyOverlayOpen()) return;     /* 다음 팝업이 이어받았다 */
    overlayHistPushed = false;
    if(location.href !== overlayHistUrl) return;   /* 그 사이 해시가 바뀌었으면 그대로 둔다 */
    if(history.state && history.state.appModal){
      overlaySelfBack = true;
      try{ history.back(); }catch(e){ overlaySelfBack = false; }
    }
  }, 0);
}
/* 팝업을 닫은 직후 해시를 바꿀 때는 쌓아 둔 엔트리를 새 주소로 갈아 끼운다(중간 엔트리 방지) */
function navHash(h){
  var target = location.pathname + location.search + (h || '');
  if(overlayHistPushed){
    overlayHistPushed = false;
    try{ history.replaceState(null, '', target); return true; }catch(e){}
  }
  location.hash = h || '';
  return false;
}
window.addEventListener('popstate', function(){
  if(overlaySelfBack){ overlaySelfBack = false; return; }   /* 정리용 back() — 무시 */
  if(!anyOverlayOpen()) return;
  overlayHistPushed = false;   /* 엔트리는 방금 소비됐다 */
  closeAll();                  /* flag가 false라 settleOverlayHistory는 히스토리를 건드리지 않는다 */
});

/* ================== 📝 수정 요청 메모 (이 기기에만 저장) ==================
   고치고 싶은 곳을 그때그때 적어 두고, [전체 복사]로 피클 채팅에 붙여넣을 수 있게 한다.
   시트는 다른 팝업과 같은 .sheet-wrap 이라 안드로이드 뒤로가기로도 닫힌다. */
var MEMO_KEY = 'imchall.memos.v1';
var MEMOS = loadMemos();
var memoTimer = null;
function loadMemos(){
  try{
    var a = JSON.parse(localStorage.getItem(MEMO_KEY) || '[]');
    return Object.prototype.toString.call(a) === '[object Array]'
      ? a.filter(function(m){ return m && m.text; }) : [];
  }catch(e){ return []; }
}
function saveMemos(){
  try{ localStorage.setItem(MEMO_KEY, JSON.stringify(MEMOS)); }catch(e){}
  paintMemoBadge();
}
function paintMemoBadge(){
  var b = document.getElementById('memoBtn'), c = document.getElementById('memoCnt');
  if(!b || !c) return;
  var n = MEMOS.length;
  b.classList.toggle('has', n > 0);
  c.textContent = n > 9 ? '9+' : String(n);
  c.hidden = n === 0;
  b.setAttribute('aria-label', n ? '수정 요청 메모 ' + n + '개' : '수정 요청 메모');
}
function memoRowsHtml(){
  if(!MEMOS.length) return '<p class="memo-empty">아직 적어 둔 요청이 없어요<br>고치고 싶은 곳을 그때그때 적어 두세요</p>';
  return MEMOS.map(function(m){
    return '<div class="memo-row"><span class="mx">' + esc(m.text) + '</span>'
      + '<button class="memo-del" type="button" data-mdel="' + esc(m.id) + '" aria-label="삭제">✕</button></div>';
  }).join('');
}
function paintMemoList(){
  var l = document.getElementById('memoList');

}
function resetMemoClear(){
  var b = document.getElementById('memoClear');
  if(!b) return;
  b.classList.remove('confirm');

}
function addMemo(){
  var inp = document.getElementById('memoInput');
  if(!inp) return;
  var v = inp.value.trim();
  if(!v){ toast('요청 내용을 적어 주세요', 'err'); inp.focus(); return; }
  MEMOS.push({ id: 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), text: v, at: Date.now() });
  saveMemos();
  inp.value = '';
  paintMemoList();
  toast('메모를 추가했어요');
  inp.focus();
}
function copyText(t){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  return new Promise(function(resolve, reject){
    var ta = document.createElement('textarea');
    ta.value = t; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, t.length);
    var ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
    ta.remove();
    if(ok) resolve(); else reject(new Error('copy failed'));
  });
}
function openMemoSheet(){

  layer.appendChild(wrap);
  sheetOpen = true;

  resetMemoClear();

  wrap.addEventListener('click', function(e){ if(e.target === wrap) closeAll(); });

  });
  document.getElementById('memoList').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-mdel]') : null;
    if(!b) return;
    MEMOS = MEMOS.filter(function(m){ return m.id !== b.getAttribute('data-mdel'); });
    saveMemos();

  document.getElementById('memoCopy').addEventListener('click', function(){
    if(!MEMOS.length){ toast('복사할 메모가 없어요', 'err'); return; }
    var text = '리훨 임챌 수정 요청:\n' + MEMOS.map(function(m){ return '- ' + m.text; }).join('\n');
    try{
      copyText(text).then(function(){ toast('복사했어요! 피클 채팅에 붙여넣기 해 주세요'); },
        function(){ toast('복사하지 못했어요 — 메모를 길게 눌러 복사해 주세요', 'err'); });
    }catch(err){ toast('복사하지 못했어요 — 메모를 길게 눌러 복사해 주세요', 'err'); }
  });
  document.getElementById('memoClear').addEventListener('click', function(e){
    if(!MEMOS.length){ toast('비울 메모가 없어요', 'err'); return; }
    var btn = e.currentTarget;

  });

function openSheet(cfg){
  var draft = deep(cfg.base || {});
  var wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = '<div class="sheet"><div class="sheet-h"><div><h3>' + esc(cfg.title) + '</h3>'
    + (cfg.sub ? '<p>' + esc(cfg.sub) + '</p>' : '') + '</div>'
    + '<button class="sheet-x" data-x aria-label="닫기">✕</button></div>'
    + '<div class="sheet-b"></div><div class="sheet-f"></div></div>';
  var body = wrap.querySelector('.sheet-b');
  var foot = wrap.querySelector('.sheet-f');
  var readers = [];
  var halfRow = null;

  cfg.fields.forEach(function(f){
    var b = buildField(f, draft);
    if(f.half){
      if(!halfRow){ halfRow = document.createElement('div'); halfRow.className = 'frow'; }
      halfRow.appendChild(b.el);
      if(halfRow.children.length === 2){ body.appendChild(halfRow); halfRow = null; }
    } else {
      if(halfRow){ body.appendChild(halfRow); halfRow = null; }
      body.appendChild(b.el);
    }
    readers.push(b);
  });
  if(halfRow) body.appendChild(halfRow);

  if(cfg.onDelete){
    var del = document.createElement('button');
    del.className = 'btn btn-danger';
    del.textContent = cfg.delLabel || '삭제';
    del.addEventListener('click', function(){
      closeAll();
      cfg.onDelete();
    });
    foot.appendChild(del);
  }
  var cancel = document.createElement('button');
  cancel.className = 'btn btn-ghost';
  cancel.textContent = '취소';
  cancel.addEventListener('click', closeAll);
  foot.appendChild(cancel);

  var save = document.createElement('button');
  save.className = 'btn btn-navy';
  save.textContent = cfg.saveLabel || '저장';
  save.addEventListener('click', function(){
    var out = {};
    for(var i=0;i<readers.length;i++){
      var r = readers[i];
      var v = r.read();
      if(r.field.required && !String(v || '').trim()){
        toast(r.field.required + '을 넣어 주세요', 'err');
        if(r.el.querySelector('input,textarea,select')) r.el.querySelector('input,textarea,select').focus();
        return;
      }
      if(r.field.type === 'head') continue;
      if(r.field.key) out[r.field.key] = v;
      r.field.setVal(draft, v);
    }
    cfg.onSave(draft, out);
  });
  foot.appendChild(save);

  wrap.addEventListener('click', function(e){ if(e.target === wrap) closeAll(); });
  wrap.querySelector('[data-x]').addEventListener('click', closeAll);
  layer.appendChild(wrap);
  sheetOpen = true;
  pushOverlayHistory();
  setTimeout(function(){
    var first = body.querySelector('input[type=text]');
    if(first && !cfg.noFocus) first.focus();
  }, 80);
}

function buildField(f, draft){
  var box = document.createElement('div');
  box.className = 'fld';
  if(f.type === 'head'){
    box.className = 'fld-head';
    box.textContent = f.label;
    return { el:box, field:f, read:function(){ return ''; } };
  }
  var lab = document.createElement('span');
  lab.className = 'fld-l';
  lab.textContent = f.label;
  box.appendChild(lab);

  if(f.type === 'text' || f.type === 'date'){
    var inp = document.createElement('input');
    inp.type = f.type === 'date' ? 'date' : 'text';
    inp.value = f.getVal(draft) || '';
    if(f.ph) inp.placeholder = f.ph;
    box.appendChild(inp);
    return { el:box, field:f, read:function(){ return inp.value; } };
  }
  if(f.type === 'textarea'){
    var ta = document.createElement('textarea');
    ta.rows = f.rows || 3;
    ta.value = f.getVal(draft) || '';
    if(f.ph) ta.placeholder = f.ph;
    box.appendChild(ta);
    return { el:box, field:f, read:function(){ return ta.value; } };
  }
  if(f.type === 'select'){
    var sel = document.createElement('select');
    f.options.forEach(function(o){
      var op = document.createElement('option');
      op.value = o[0]; op.textContent = o[1];
      sel.appendChild(op);
    });
    sel.value = f.getVal(draft);
    box.appendChild(sel);
    return { el:box, field:f, read:function(){ return sel.value; } };
  }
  if(f.type === 'stars'){
    var val = f.getVal(draft) || 0;
    var row = document.createElement('div');
    row.className = 'starrow';
    var paint = function(){
      Array.prototype.forEach.call(row.children, function(b, i){ b.classList.toggle('on', i < val); });
    };
    for(var i=1;i<=5;i++){
      (function(n){
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'st'; b.textContent = '★';
        b.setAttribute('aria-label', n + '점');
        b.addEventListener('click', function(){ val = (val === n ? n - 1 : n); paint(); });
        row.appendChild(b);
      })(i);
    }
    paint();
    box.appendChild(row);
    return { el:box, field:f, read:function(){ return val; } };
  }
  if(f.type === 'list'){
    var rowsBox = document.createElement('div');
    rowsBox.className = 'rows';
    var listBox = document.createElement('div');
    listBox.className = 'listbox';
    listBox.appendChild(rowsBox);

    var addRow = function(v){
      var row = document.createElement('div');
      row.className = 'lrow';
      f.cols.forEach(function(c){
        var lf = document.createElement('label');
        lf.className = 'lf';
        var lc = document.createElement('span');
        lc.className = 'lc'; lc.textContent = c.label;
        var inEl = document.createElement(c.type === 'textarea' ? 'textarea' : 'input');
        if(inEl.tagName === 'INPUT') inEl.type = 'text';
        else inEl.rows = 2;
        inEl.dataset.k = c.key;
        inEl.value = v[c.key] || '';
        if(c.ph) inEl.placeholder = c.ph;
        lf.appendChild(lc); lf.appendChild(inEl);
        row.appendChild(lf);
      });
      var del = document.createElement('button');
      del.type = 'button'; del.className = 'lrow-x'; del.textContent = '✕';
      del.setAttribute('aria-label', '이 항목 삭제');
      del.addEventListener('click', function(){ row.remove(); });
      row.appendChild(del);
      rowsBox.appendChild(row);
    };

    var v0 = f.getVal(draft);
    v0.forEach(function(o){ addRow(o); });
    if(!v0.length) addRow(f.blank);

    var add = document.createElement('button');
    add.type = 'button'; add.className = 'addrow';
    add.textContent = f.addText || '＋ 추가';
    add.addEventListener('click', function(){ addRow(f.blank); });
    listBox.appendChild(add);
    box.appendChild(listBox);

    return { el:box, field:f, read:function(){
      var out = [];
      Array.prototype.forEach.call(rowsBox.children, function(row){
        var o = {};
        var any = false;
        Array.prototype.forEach.call(row.querySelectorAll('[data-k]'), function(el){
          var t = el.value.trim();
          o[el.dataset.k] = t;
          if(t) any = true;
        });
        if(any) out.push(o);
      });
      return out;
    }};
  }
  return { el:box, field:f, read:function(){ return ''; } };
}

function confirmBox(title, body, okText, onOk){
  var wrap = document.createElement('div');
  wrap.className = 'modal-wrap';
  wrap.innerHTML = '<div class="modal"><h3>' + esc(title) + '</h3><p>' + body + '</p>'
    + '<div class="mrow"><button class="btn btn-ghost" data-no>취소</button>'
    + '<button class="btn btn-red" data-yes>' + esc(okText) + '</button></div></div>';
  wrap.querySelector('[data-no]').addEventListener('click', closeAll);
  wrap.querySelector('[data-yes]').addEventListener('click', function(){ closeAll(); onOk(); });
  wrap.addEventListener('click', function(e){ if(e.target === wrap) closeAll(); });
  layer.appendChild(wrap);
  sheetOpen = true;
  pushOverlayHistory();
}
