<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>리훨 부부데이지 임장챌린지</title>
<meta name="description" content="리훨 임챌 — 훨훨의 임장챌린지를 따라 걷는 부부의 기록">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FBE049">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="리훨 임챌">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
  :root{
    --yellow:#FBE049; --yellow-deep:#F1D22F; --white:#FFFFFF; --cream:#FDF8E7; --line:#F1EAD0;
    --navy:#1E1B7A; --green:#2F8F52; --green-soft:#E4F3E1; --red:#C0352B; --red-soft:#FBE9E6;
    --ink:#20201C; --soft:#8A8674; --star:#F0B429;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--yellow);color:var(--ink);
    font-family:"Pretendard","Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Malgun Gothic","Segoe UI",system-ui,sans-serif;
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
    word-break:keep-all;overflow-wrap:break-word;overscroll-behavior-y:none;
  }
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit;padding:0}
  input,textarea,select{font:inherit;color:inherit}
  a{color:inherit}
  .hidden,[hidden]{display:none !important}
  :focus-visible{outline:2px solid var(--navy);outline-offset:2px}

  /* ============ 틀 ============ */
  #app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
  .top{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:calc(env(safe-area-inset-top) + 14px) 18px 8px}
  .brand{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;margin:0;font-size:19px;font-weight:900;letter-spacing:-.045em;color:var(--navy);line-height:1.2}
  .brand .bi{flex:0 0 auto;font-size:20px}
  .brand .bt{min-width:0}
  .tr{flex:0 0 auto}
  .tr{display:flex;align-items:center;gap:9px}
  .dot{width:8px;height:8px;border-radius:50%;background:#BDB79B;transition:background .3s}
  .dot.live{background:var(--green)}
  .dot.warn{background:#D08A17}
  .ib{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.65);display:grid;place-items:center;font-size:15px;line-height:1}
  .ib.on{background:var(--white);box-shadow:0 4px 12px rgba(112,86,0,.18)}
  .seasons{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:4px 18px 8px;scrollbar-width:none}
  .seasons::-webkit-scrollbar{display:none}
  .s{flex:0 0 auto;padding:9px 15px;border-radius:999px;background:rgba(255,255,255,.55);font-size:13.5px;font-weight:900;color:#6E6851;letter-spacing:-.02em}
  .s.on{background:var(--navy);color:#fff}
  #view{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:4px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
  #view>*{flex:0 0 auto}
  #view::-webkit-scrollbar{display:none}

  /* ============ 공통 ============ */
  .card{background:var(--white);border-radius:26px;padding:6px;display:flex;flex-direction:column}
  .sub{margin:0 4px;font-size:12.5px;font-weight:700;color:#5D5A46;letter-spacing:-.02em}
  .sub b{color:var(--navy);font-weight:900}
  .pill{flex:0 0 auto;font-size:11.5px;font-weight:800;color:#7C765C;background:var(--cream);padding:4px 10px;border-radius:999px;white-space:nowrap}
  .pill.green{background:var(--green-soft);color:#22502D}
  .pill.navy{background:var(--navy);color:#fff}
  .back{align-self:flex-start;max-width:100%;padding:8px 14px 8px 11px;border-radius:999px;background:rgba(255,255,255,.65);
    font-size:12.5px;font-weight:900;color:#5D5A46;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .eyebrow{font-size:12px;font-weight:900;color:#7A7560;margin-bottom:2px;letter-spacing:-.01em}
  h1.t{margin:0;font-size:24px;font-weight:900;letter-spacing:-.05em;color:var(--navy);line-height:1.2}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:2px 6px 0}
  .head .side{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .head+.sub{margin-top:-2px;padding:0 2px}
  .pen{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:13px}
  .emptybox{text-align:center;padding:36px 16px;font-size:13.5px;font-weight:700;color:#5D5A46;background:rgba(255,255,255,.5);border-radius:26px;line-height:1.65}
  .emptybox b{color:var(--navy)}
  .add{height:54px;border-radius:999px;background:var(--navy);color:#fff;font-weight:900;font-size:15px;letter-spacing:-.02em;
    display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:2px}
  .add:active{transform:scale(.985)}
  .add.ghost{background:rgba(255,255,255,.7);color:var(--navy);height:46px;font-size:13.5px}

  /* 접힌 한 줄 */
  .row{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:20px;min-height:56px;text-decoration:none;color:inherit}
  .row:active{background:var(--cream)}
  .row+.row,.row+.acc,.acc+.row,.acc+.acc{border-top:1px solid var(--line);border-radius:0}
  .row .ic{flex:0 0 auto;width:34px;height:34px;border-radius:12px;background:var(--cream);display:grid;place-items:center;font-size:16px}
  .row .tx{flex:1 1 auto;min-width:0;font-size:15px;font-weight:900;letter-spacing:-.035em}
  .row .tx small{display:block;font-size:12px;font-weight:700;color:var(--soft);letter-spacing:-.02em;margin-top:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .ar{flex:0 0 auto;font-size:19px;line-height:1;color:#C9C3AB;transition:transform .18s}
  .row .go{flex:0 0 auto;font-size:12.5px;font-weight:900;color:var(--navy)}
  .row.off .tx{color:#A29C84}
  .acc.open>.row .ar{transform:rotate(90deg)}
  .acc>.panel{display:none;padding:2px 14px 16px;flex-direction:column;gap:10px}
  .acc.open>.panel{display:flex}

  /* ============ 목록 ============ */
  .vrow{display:flex;align-items:center;gap:12px;width:100%;background:var(--white);border-radius:22px;padding:13px 15px;transition:transform .12s}
  .vrow:active{transform:scale(.985)}
  .no{flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:var(--cream);display:grid;place-items:center;color:var(--navy);
    font-size:17px;font-weight:900;letter-spacing:-.03em}
  .vrow.done .no{background:var(--navy);color:#FFE680}
  .vt{flex:1 1 auto;min-width:0}
  .vt strong{display:block;font-size:15px;font-weight:900;letter-spacing:-.035em;line-height:1.3}
  .vt span{display:block;font-size:12px;font-weight:700;color:var(--soft);margin-top:1px}
  .vdate{flex:0 0 auto;padding:5px 10px;border-radius:999px;background:var(--cream);color:var(--navy);font-size:12px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
  .chev{flex:0 0 auto;font-size:20px;color:#C9C3AB;line-height:1}

  /* ============ 지도·사진 ============ */
  .imgbox{position:relative;border-radius:18px;overflow:hidden;background:var(--cream);border:1.5px solid var(--line);aspect-ratio:4/3;display:block;width:100%;padding:0}
  .imgbox img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
  .imgbox img.ok{opacity:1}
  .imgbox .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-weight:700;color:#A29C84}
  .imgbox img.ok + .ph{display:none}
  .imgbox.contain img{object-fit:contain;background:#fff}
  .ctl{display:flex;gap:8px}
  .ctl button{flex:1 1 0;height:42px;border-radius:999px;background:var(--cream);font-size:13px;font-weight:900;color:var(--navy);
    display:flex;align-items:center;justify-content:center}
  .ctl button.danger{flex:0 0 auto;padding:0 16px;color:var(--red);background:var(--red-soft)}
  .none{margin:0;font-size:13px;font-weight:700;color:var(--soft);text-align:center;padding:10px 0}

  /* ============ 지점 세로 동그라미 ============ */
  .sech{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 4px}
  .sech h2{margin:0;font-size:15px;font-weight:900;letter-spacing:-.03em}
  .pts{display:flex;flex-direction:column;padding:4px 10px 10px}
  .pt{position:relative;display:flex;align-items:center;gap:12px;padding:5px 0}
  .pt::before{content:"";position:absolute;left:17px;top:0;bottom:0;width:2.5px;background:var(--line)}
  .pt:first-child::before{top:50%}
  .pt:last-child::before{bottom:50%}
  .pt:only-child::before{display:none}
  .circ{position:relative;z-index:1;flex:0 0 auto;width:36px;height:36px;border-radius:50%;background:var(--white);border:2.5px solid var(--navy);
    color:var(--navy);display:grid;place-items:center;font-size:15px;font-weight:900;transition:background .15s,color .15s,transform .12s}
  .circ:active{transform:scale(.9)}
  .pt.vis .circ,.circ.vis{background:var(--navy);color:#FFE680}
  .circ.lg{font-size:12px;letter-spacing:-.05em}
  .tag{display:inline-block;margin-left:7px;padding:2px 8px;border-radius:999px;background:#FBE9E6;color:#B4552E;font-size:10.5px;font-weight:900;letter-spacing:-.02em;vertical-align:1px}
  .kindpill{flex:0 0 auto;align-self:center}
  .ptitle .circ.lg{font-size:15px}
  .pn{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px;border-radius:16px;padding:10px 12px;text-align:left}
  .pn:active{background:var(--cream)}
  .pn .nm{flex:1 1 auto;min-width:0;font-size:14.5px;font-weight:900;letter-spacing:-.035em;line-height:1.3}
  .pn .ar{flex:0 0 auto;font-size:18px;color:#C9C3AB;line-height:1}
  .hint{margin:0 6px;font-size:11.5px;font-weight:700;color:#6E6851;text-align:center}

  .sech .side{display:flex;align-items:center;gap:6px}
  .pill.ordbtn{background:var(--cream);color:var(--navy);font-weight:900;padding:6px 12px}
  .pill.ordbtn.on{background:var(--navy);color:#fff}
  .pts.ed{padding:2px 10px 10px;gap:0}
  .pts.ed .pt::before{display:none}
  .pt.ed{padding:3px 0}
  .pt.ed .nm{flex:1 1 auto;min-width:0;font-size:14.5px;font-weight:900;letter-spacing:-.035em;line-height:1.3}
  .pt.ed .circ{cursor:default}
  .mv{display:flex;align-items:center;gap:4px;flex:0 0 auto}
  .mv button.ed{background:#fff;border:1.5px solid #E7DDBE;font-size:12px}
  .mv button{width:34px;height:34px;border-radius:50%;background:var(--cream);color:var(--navy);font-size:13px;font-weight:900;display:grid;place-items:center;text-align:center}
  .mv button:disabled{opacity:.3;cursor:default}
  .mv button:active:not(:disabled){background:#F1E8C4}
  .mv button.rm{background:var(--red-soft);color:var(--red)}
  .ins{display:block;width:100%;height:28px;margin:1px 0;border-radius:999px;border:1.5px dashed #D9CF9E;color:#8F8A73;font-size:11.5px;font-weight:800;text-align:center;letter-spacing:-.02em}
  .ins:active{background:var(--cream)}

  /* ============ 지점 상세 ============ */
  .ptitle{display:flex;align-items:center;gap:12px;padding:2px 6px}
  .ptitle .circ{width:46px;height:46px;font-size:19px}
  .ptitle h1.t{font-size:21px;flex:1 1 auto;min-width:0}
  .links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .lk{display:flex;align-items:center;justify-content:center;gap:6px;height:48px;border-radius:999px;background:var(--white);
    font-size:13.5px;font-weight:900;color:var(--navy);text-decoration:none;box-shadow:0 6px 14px rgba(112,86,0,.1)}
  .lk.off{opacity:.5;box-shadow:none;background:rgba(255,255,255,.55)}
  .spec{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .sp{background:var(--cream);border-radius:16px;padding:10px 12px;min-width:0}
  .sp small{display:block;font-size:11px;font-weight:800;color:var(--soft)}
  .sp b{display:block;font-size:15px;font-weight:900;letter-spacing:-.03em;margin-top:1px;overflow-wrap:anywhere}
  .photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .ph1{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#F6EEC9,#EADFAE);padding:0}
  .ph1 img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
  .ph1 img.ok{opacity:1}
  .ph1.add{background:var(--white);border:2px dashed #D9CF9E;color:#8F8A73;font-size:12px;font-weight:900;text-align:center;line-height:1.3;
    display:grid;place-items:center}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:16px;border:1px solid #E7DDBE;margin:0 -4px}
  .tbl{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%}
  .tbl th,.tbl td{border-right:1px solid #EFE6C8;border-bottom:1px solid #EFE6C8;padding:8px 10px;vertical-align:middle;background:#fff}
  .tbl tr>:last-child{border-right:0}
  .tbl tbody tr:last-child>*{border-bottom:0}
  .tbl th.g{position:sticky;left:0;z-index:3;width:30px;min-width:30px;padding:0;text-align:center;color:#fff;font-weight:900;font-size:12px;letter-spacing:.1em}
  .tbl th.g span{display:block;writing-mode:vertical-rl;margin:0 auto;padding:4px 0;white-space:nowrap}
  .tbl .grp-a{background:#5B64B8}
  .tbl .grp-b{background:var(--navy)}
  .tbl .grp-c{background:#7A6A2E}
  .tbl .grp-d{background:var(--green)}
  .tbl thead th{background:var(--cream);font-weight:900;color:var(--navy);text-align:center;position:sticky;top:0;z-index:2}
  .tbl thead th.g{z-index:4;background:var(--cream)}
  .tbl thead th.c{min-width:132px;max-width:170px;font-size:14px;letter-spacing:-.03em}
  .tbl thead th.c button{width:100%;text-align:center;font-weight:900;color:var(--navy);font-size:14px}
  .tbl th.l{position:sticky;left:30px;z-index:3;min-width:96px;background:#EEF0FB;color:#2B2F66;font-weight:900;font-size:12.5px;text-align:left;letter-spacing:-.03em;box-shadow:2px 0 0 #E7DDBE}
  .tbl th.l small,.tbl th.corner small{display:block;font-size:10.5px;font-weight:700;color:#7A7F9E;margin-top:1px}
  .tbl thead th.corner{background:#EEF0FB;z-index:4;text-align:left;font-size:12.5px;color:#2B2F66}
  .tbl td{text-align:center;font-weight:800;color:var(--ink);letter-spacing:-.03em;min-width:132px}
  .tbl td.txt{font-size:13px;font-weight:700}
  .tbl td.num{font-variant-numeric:tabular-nums;font-size:14px}
  .tbl td small{display:block;font-size:10.5px;font-weight:700;color:#8F8A73;margin-top:2px;line-height:1.35}
  .tbl td.hl{background:#FFF1C2}
  .tbl td.pe{background:#FDEAE0}
  .tbl td.pe2{background:#E8F0FB}
  .tbl td.blue{color:#2A2DD0}
  .tbl td.strong{font-weight:900;font-size:15px}
  .tbl td.total{background:var(--navy);color:#FFE680;font-size:16px}
  .tbl td .neg{color:var(--red)}
  .setup{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .sc{background:var(--cream);border-radius:20px;padding:12px 13px;display:flex;flex-direction:column;gap:6px;min-width:0}
  .sc h3{margin:0 0 2px;font-size:13.5px;font-weight:900;color:var(--navy);letter-spacing:-.03em}
  .sc.g h3{color:var(--green)}
  .r{display:flex;align-items:baseline;justify-content:space-between;gap:4px;font-size:12px;font-weight:800;color:var(--soft)}
  .r b{font-size:13.5px;font-weight:900;color:var(--ink);letter-spacing:-.03em;text-align:right}
  .tot{margin-top:2px;border-radius:14px;background:var(--navy);color:#fff;padding:9px 11px}
  .tot small{display:block;font-size:10.5px;font-weight:800;color:#CFCBF3}
  .tot b{font-size:16px;font-weight:900;color:#FFE680;letter-spacing:-.04em}
  .note{margin:0 2px;font-size:11.5px;font-weight:700;color:var(--soft);line-height:1.5}
  .memo{background:var(--cream);border-radius:16px;padding:12px 14px;font-size:13.5px;font-weight:600;color:#4A4738;line-height:1.6;white-space:pre-line}
  .vtog{align-self:center;height:48px;padding:0 24px;border-radius:999px;background:rgba(255,255,255,.75);font-size:14px;font-weight:900;color:#6E6851}
  .vtog.on{background:var(--navy);color:#FFE680}

  /* ============ 시트 / 모달 ============ */
  .sheet-wrap{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;
    background:rgba(26,22,6,.5);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  .sheet{width:100%;max-width:560px;max-height:92vh;background:#fff;border-radius:28px 28px 0 0;display:flex;flex-direction:column;overflow:hidden;
    animation:up .22s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
  .sheet-h{flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;padding:20px 20px 12px;border-bottom:1px solid var(--line)}
  .sheet-h h3{margin:0;font-size:18px;font-weight:900;letter-spacing:-.04em;color:var(--navy);line-height:1.3}
  .sheet-h p{margin:3px 0 0;font-size:12.5px;font-weight:600;color:var(--soft);line-height:1.5}
  .sheet-x{margin-left:auto;flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--cream);display:grid;place-items:center;font-size:14px;color:#7C765C}
  .sheet-b{flex:1 1 auto;min-height:0;overflow-y:auto;padding:16px 20px 10px;display:flex;flex-wrap:wrap;gap:14px 10px}
  .sheet-f{flex:0 0 auto;display:flex;gap:8px;padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff}
  .btn{flex:1 1 0;height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;letter-spacing:-.02em}
  .btn-navy{background:var(--navy);color:#fff}
  .btn-ghost{background:var(--cream);color:#6E6851;flex:0 0 auto;padding:0 20px}
  .btn-danger{background:var(--red-soft);color:var(--red);flex:0 0 auto;padding:0 18px}
  .btn-red{background:var(--red);color:#fff}
  .fld{flex:1 1 100%;display:flex;flex-direction:column;gap:6px;min-width:0}
  .fld.half{flex:1 1 calc(50% - 5px)}
  .fld-l{font-size:12.5px;font-weight:800;color:#5D5A46;letter-spacing:-.02em}
  .fld input,.fld textarea,.fld select{width:100%;background:var(--cream);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;
    font-size:16px;font-weight:600;color:var(--ink);outline:none;letter-spacing:-.02em;line-height:1.45;appearance:none;-webkit-appearance:none}
  .fld textarea{resize:vertical;min-height:84px}
  .fld input::placeholder,.fld textarea::placeholder{color:#C0BAA2;font-weight:600}
  .fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--navy);background:#fff}
  .fld select{background-image:linear-gradient(45deg,transparent 50%,#9A947C 50%),linear-gradient(135deg,#9A947C 50%,transparent 50%);
    background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
  .fld .hint2{font-size:11.5px;font-weight:600;color:var(--soft)}
  .fld-head{flex:1 1 100%;display:flex;align-items:center;gap:8px;margin-top:4px;font-size:13px;font-weight:900;color:var(--navy)}
  .fld-head::after{content:"";flex:1 1 auto;height:1px;background:var(--line)}
  .modal-wrap{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:22px;background:rgba(30,27,20,.45);
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
  .modal{width:100%;max-width:340px;background:#fff;border-radius:26px;padding:24px 22px 18px;display:flex;flex-direction:column;gap:10px;
    box-shadow:0 20px 50px rgba(60,45,0,.3);animation:pop .18s}
  @keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:none;opacity:1}}

  /* 입장 화면 */

  /* PIN */
  .pin-wrap{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:22px;background:rgba(30,27,20,.45);

  .pin-card{width:100%;max-width:340px;background:#fff;border-radius:30px;padding:28px 24px 20px;text-align:center;box-shadow:0 20px 50px rgba(60,45,0,.3);animation:pop .18s}
  .pin-fl{width:56px;height:56px;margin:0 auto;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:26px;line-height:1}
  .pin-t{margin:12px 0 0;font-size:22px;font-weight:900;letter-spacing:-.04em;color:var(--navy)}

  .pin-dots{display:flex;justify-content:center;gap:14px;margin:20px 0 0;height:16px}
  .pin-dot{width:14px;height:14px;border-radius:50%;background:#EDE7D1;transition:transform .12s,background .12s}
  .pin-dot.on{background:var(--navy);transform:scale(1.08)}
  .pin-msg{margin:10px 0 0;min-height:18px;font-size:13px;font-weight:700;color:var(--red)}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:8px}
  .key{height:54px;border-radius:999px;background:var(--cream);color:var(--navy);font-size:22px;font-weight:800;display:grid;place-items:center;transition:transform .1s,background .15s}
  .key:active{transform:scale(.95);background:#F6EFD6}
  .key.ghost{background:transparent;color:var(--soft);font-size:16px}
  .pin-x{margin-top:12px;font-size:13px;font-weight:800;color:#9A947C;padding:8px 12px}
  .shake{animation:shake .34s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

  /* 사진·지도 크게 보기 (가로로 눕히기 · 두 손가락 확대 · 드래그 이동) */

  .big-wrap img{position:absolute;left:50%;top:50%;max-width:none;max-height:none;transform-origin:center center;will-change:transform;

  .big-bar button:active{background:#F1E8C4}

  .big-hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 20px);transform:translateX(-50%);max-width:calc(100vw - 90px);padding:7px 13px;border-radius:999px;background:rgba(255,255,255,.18);
    color:#EFEBFF;font-size:12px;font-weight:700;text-align:center;pointer-events:none;transition:opacity .5s;z-index:1}

  #toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));z-index:120;transform:translateX(-50%) translateY(10px);
    background:var(--navy);color:#fff;font-size:13.5px;font-weight:800;padding:12px 18px;border-radius:999px;max-width:88vw;text-align:center;
    letter-spacing:-.02em;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;box-shadow:0 12px 28px rgba(30,27,122,.3)}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

<body>
<div id="app">
  <header class="top">
    <h1 class="brand"><span class="bi">👣</span><span class="bt">리훨 부부데이지 임장챌린지</span></h1>
    <div class="tr">
      <span id="dot" class="dot" title="동기화 상태" aria-label="동기화 상태"></span>
      <button id="lockBtn" class="ib" aria-label="기록 모드 켜기">🔒</button>
    </div>
  </header>
  <nav id="seasons" class="seasons" aria-label="시즌"></nav>
  <main id="view"></main>
</div>
<div id="layer"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ================== 상수 ================== */
var DB = 'https://bubulife-678ac-default-rtdb.firebaseio.com';
var ROOM = null;   /* 입장 비밀번호로 계산한 비밀 방 이름 (아래 '입장') */
var KEY_LS = 'imchall.room.v3';
var LS = 'imchall.unlock.v1';
var PW_HASH = '0341266d632db4ef5aeac567ed6d00f44506e1c4f73f9e7a44f8cbc21888c597';
var SALT = 'imchall::v1::';
var CACHE_KEY = 'imchall.cache.v2';
var SEASON_KEY = 'imchall.season.v2';
var SEASONS = 8;

var roomUrl = function(){ return DB + '/rooms/' + ROOM + '.json'; };
var nodeUrl = function(p){ return DB + '/rooms/' + ROOM + '/' + p + '.json'; };

/* ================== 상태 ================== */
var S = { videos:{} };
var unlocked = false;
var sheetOpen = false;
var lastWrite = 0;
var es = null, pollTimer = null, refreshTimer = null;
var openAcc = {};
var orderMode = null;   /* 순서·편집 모드가 켜진 영상 id */
var viewEl = document.getElementById('view');
var layer = document.getElementById('layer');
var dotEl = document.getElementById('dot');
var lockBtn = document.getElementById('lockBtn');
var toastEl = document.getElementById('toast');
var seasonsEl = document.getElementById('seasons');
var lastSeason = 1;
try{ lastSeason = Math.min(SEASONS, Math.max(1, parseInt(localStorage.getItem(SEASON_KEY), 10) || 1)); }catch(e){}

/* ================== 유틸 ================== */
function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function deep(o){ return JSON.parse(JSON.stringify(o || {})); }
function arr(x){
  if(Array.isArray(x)) return x.filter(function(i){ return i != null; });
  if(x && typeof x === 'object') return Object.keys(x).sort(function(a,b){ return a - b; }).map(function(k){ return x[k]; });
  return [];
}
function safeUrl(u){
  u = String(u || '').trim();
  return /^https?:\/\//i.test(u) ? u : '';
}
function today(){
  var d = new Date(), p = function(n){ return (n<10?'0':'') + n; };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function fmtDate(s){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
  return m ? (m[1] + '.' + m[2] + '.' + m[3]) : String(s || '');
}
function newId(p){ return (p || 'x') + Date.now().toString(36) + Math.floor(Math.random()*1e4).toString(36); }
var toastT = null;
function toast(msg, kind){
  toastEl.textContent = msg;
  toastEl.className = 'on' + (kind === 'err' ? ' err' : '');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ toastEl.className = ''; }, 2100);
}

/* ---------- 금액 (단위: 만원) ---------- */
function parseMoney(v){
  var s = String(v == null ? '' : v).replace(/[\s,]/g, '').replace(/원/g, '');
  if(!s) return 0;
  var m = /(\d+(?:\.\d+)?)억(\d+(?:\.\d+)?)?/.exec(s);
  if(m) return Math.round((parseFloat(m[1]) || 0) * 10000 + (m[2] ? parseFloat(m[2]) : 0));
  m = /(\d+(?:\.\d+)?)만/.exec(s);
  if(m) return Math.round(parseFloat(m[1]));
  m = /(\d[\d.]*)/.exec(s);
  return m ? Math.round(parseFloat(m[1].replace(/\.$/, '')) || 0) : 0;
}
function fmtMoney(v){
  v = Math.round(Number(v) || 0);
  if(!v) return '—';
  var eok = Math.floor(v / 10000), man = v % 10000, out = '';
  if(eok) out += eok.toLocaleString('ko-KR') + '억';
  if(man) out += (out ? ' ' : '') + man.toLocaleString('ko-KR') + '만';
  return out || '0';
}
/* 부대비용(중개료 + 취득세 등)은 따로 계산하지 않고 매매가 × 0.5% 로 묶는다 */
var EXTRA_RATE = 0.005;
function fmtNum(n){
  n = Math.round(Number(n) || 0);
  return n ? n.toLocaleString('ko-KR') : '—';
}
/* 아파트 매물세팅: 매매 / 전세 or 대출 / 자본   (전세와 대출 중 하나만 — 대출은 규제 때문에 자동 계산하지 않고 직접 입력)
   초투 = 자본(= 매매 − 전세 또는 대출), 총투 = 매매.  부대비용(중개료·취득세를 묶은 매매 × 0.5%)은 초투·총투에 넣지 않고 따로 보여 준다
   (예전 입력: 전세·대출을 따로 적은 매물은 대출을 우선, 없으면 전세로 읽는다) */
function fundOf(L){
  L = L || {};
  if(L.fk === 'jeonse' || L.fk === 'loan') return { fk:L.fk, fund:parseMoney(L.fund) };
  if(parseMoney(L.loan)) return { fk:'loan', fund:parseMoney(L.loan) };
  if(parseMoney(L.jeonse)) return { fk:'jeonse', fund:parseMoney(L.jeonse) };
  return { fk:(L.fk === 'loan' ? 'loan' : 'jeonse'), fund:0 };
}
function seedOf(L){
  L = L || {};
  var price = parseMoney(L.maemae), fo = fundOf(L);
  var extra = Math.round(price * EXTRA_RATE);
  var own = (price && fo.fund) ? price - fo.fund : null;
  return { price:price, fk:fo.fk, label:fo.fk === 'loan' ? '대출' : '전세', fund:fo.fund, own:own, extra:extra };
}
/* 재개발: 초투 = 매매, 총투 = 매매가 + 추가분담금 */
function redevOf(L){
  L = L || {};
  var price = parseMoney(L.maemae), hasShare = !(L.share === undefined || L.share === null || L.share === ''), share = parseMoney(L.share);
  return { price:price, share:share, hasShare:hasShare, total:(price && hasShare) ? price + share : null };
}

/* ================== 사진 (Firebase 옆 노드, 방 본문과 분리) ==================
   키: 지도 '<영상>_m1' '<영상>_m2' / 현장사진 '<영상>_<지점>_<사진>' */
var imgCache = {};   /* key → { ts, data, loading } */
function imgNodeUrl(key){ return DB + '/rooms/' + ROOM + '-img/' + encodeURIComponent(key) + '.json'; }
function imgTag(key, ts, cls){
  return '<img data-img="' + esc(key) + '" data-ts="' + esc(ts || '') + '" alt=""' + (cls ? ' class="' + cls + '"' : '') + '>';
}
function fetchImg(key, ts){
  var c = imgCache[key];
  if(c && c.loading) return;
  imgCache[key] = { ts: ts, data: (c && c.data) || '', loading: true };
  fetch(imgNodeUrl(key), { cache:'no-store' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(o){
    imgCache[key] = { ts: ts, data: (o && o.data) || '' };
    paintImgs();
  }).catch(function(){ imgCache[key] = { ts: ts, data: '', err: true }; });
}
function paintImgs(){
  Array.prototype.forEach.call(document.querySelectorAll('img[data-img]'), function(img){
    var key = img.getAttribute('data-img'), ts = img.getAttribute('data-ts');
    var c = imgCache[key];
    if(c && c.data && (!ts || String(c.ts) === ts)){
      if(img.getAttribute('src') !== c.data) img.src = c.data;
      img.classList.add('ok');
    } else if(!c || (!c.loading && !c.err && String(c.ts) !== ts) || (c && !c.data && !c.loading && !c.err)){
      fetchImg(key, ts);
    }
  });
}
function compressImage(file, tries, done, fail){
  var url = URL.createObjectURL(file), img = new Image();
  img.onload = function(){
    var w = img.naturalWidth || 1200, h = img.naturalHeight || 900, i = 0;
    var step = function(){
      var scale = Math.min(1, tries[i][0] / w);
      var cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
      var cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
      var ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch); ctx.drawImage(img, 0, 0, cw, ch);
      var data = cv.toDataURL('image/jpeg', tries[i][1]);
      i++;
      if(data.length > tries.limit && i < tries.length) return step();
      URL.revokeObjectURL(url);
      done(data, cw, ch);
    };
    step();
  };
  img.onerror = function(){ URL.revokeObjectURL(url); if(fail) fail(); };
  img.src = url;
}
var MAP_TRIES = [[1600, 0.82], [1300, 0.72], [1000, 0.62]]; MAP_TRIES.limit = 900000;
var PHOTO_TRIES = [[1100, 0.78], [900, 0.68], [720, 0.6]]; PHOTO_TRIES.limit = 380000;
function putImg(key, data, w, h, ts){
  lastWrite = Date.now();
  return fetch(imgNodeUrl(key), { method:'PUT', cache:'no-store', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ data:data, w:w, h:h, ts:ts }) }).then(function(r){ if(!r.ok) throw new Error('http ' + r.status); return true; });
}
function delImg(key){
  lastWrite = Date.now();
  delete imgCache[key];
  return fetch(imgNodeUrl(key), { method:'DELETE', cache:'no-store' }).then(function(r){ if(!r.ok) throw new Error('http ' + r.status); return true; });
}
function pickFiles(multiple, cb, accept){
  var inp = document.createElement('input');
  inp.type = 'file'; if(accept !== '') inp.accept = accept || 'image/*'; inp.multiple = !!multiple; inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.addEventListener('change', function(){
    var fs = Array.prototype.slice.call(inp.files || []);
    inp.remove();
    if(fs.length) cb(fs);
  });
  inp.click();
}

/* ================== 데이터 ================== */
function normalize(data){
  data = data || {};
  var out = {};
  if(data.videos && typeof data.videos === 'object'){
    Object.keys(data.videos).forEach(function(id){
      var v = data.videos[id];
      if(v && typeof v === 'object'){
        v = deep(v); v.id = id;
        v.points = arr(v.points).map(function(p){ p.photos = arr(p.photos); p.listings = arr(p.listings); return p; });
        out[id] = v;
      }
    });
  }
  S.videos = out;
}
function videosOf(season){
  return Object.keys(S.videos).map(function(id){ return S.videos[id]; })
    .filter(function(v){ return Number(v.season) === season; })
    .sort(function(a,b){ return (Number(a.no) || 0) - (Number(b.no) || 0); });   /* 번호 오름차순 (NO.1 → NO.2 → …) */
}
function api(path, method, body){
  var opt = { method: method || 'GET', cache:'no-store', headers:{ 'Content-Type':'application/json' } };
  if(body !== undefined) opt.body = JSON.stringify(body);
  return fetch(nodeUrl(path), opt).then(function(r){
    if(!r.ok) throw new Error('http ' + r.status);
    return r.status === 204 ? null : r.json();
  });
}
function refresh(force){
  if(!ROOM) return Promise.resolve();   /* 입장 전에는 서버를 읽지 않는다 */
  if(!force && (sheetOpen || Date.now() - lastWrite < 2500)) return Promise.resolve();
  return fetch(roomUrl(), { cache:'no-store' }).then(function(r){
    if(!r.ok) throw new Error('http ' + r.status);
    return r.json();
  }).then(function(data){
    normalize(data);
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }catch(e){}
    dotEl.className = 'dot live';
    render(true);
  }).catch(function(){ dotEl.className = 'dot warn'; });
}
function loadCache(){
  try{ var raw = localStorage.getItem(CACHE_KEY); if(raw) normalize(JSON.parse(raw)); }catch(e){}
}
function queueRefresh(){
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(function(){ refresh(false); }, 450);
}
function startSync(){
  try{
    es = new EventSource(roomUrl());
    var on = function(){ queueRefresh(); };
    es.addEventListener('put', on);
    es.addEventListener('patch', on);
    es.addEventListener('keep-alive', function(){ dotEl.className = 'dot live'; });
    es.onopen = function(){ dotEl.className = 'dot live'; };
    es.onerror = function(){ dotEl.className = 'dot warn'; if(es){ es.close(); es = null; } };
  }catch(e){ dotEl.className = 'dot warn'; }
  pollTimer = setInterval(function(){ if(document.visibilityState === 'visible') refresh(false); }, 15000);
}
function saveVideo(id, body, msg, quiet){
  lastWrite = Date.now();
  var payload = deep(body);
  delete payload.id;
  return api('videos/' + encodeURIComponent(id), 'PUT', payload).then(function(){
    payload.id = id;
    payload.points = arr(payload.points);
    S.videos[id] = payload;
    dotEl.className = 'dot live';
    if(!quiet) toast(msg || '저장했어요 ✓');
    closeAll();
    render(true);
    return true;
  }).catch(function(){
    lastWrite = 0;
    dotEl.className = 'dot warn';
    toast('저장하지 못했어요 — 연결을 확인해 주세요', 'err');
    return false;
  });
}
function allImgKeys(v){
  var keys = [v.id + '_m1', v.id + '_m2'];
  arr(v.points).forEach(function(p){ arr(p.photos).forEach(function(ph){ keys.push(v.id + '_' + p.pid + '_' + ph); }); });
  return keys;
}
function deleteVideo(id){
  var v = S.videos[id];
  lastWrite = Date.now();
  return api('videos/' + encodeURIComponent(id), 'DELETE').then(function(){
    if(v) allImgKeys(v).forEach(function(k){ delImg(k).catch(function(){}); });
    var season = v ? Number(v.season) : lastSeason;
    delete S.videos[id];
    toast('삭제했어요');
    closeAll();
    if(!navHash('#s=' + season)) render();
  }).catch(function(){ toast('삭제하지 못했어요 — 연결을 확인해 주세요', 'err'); });
}

/* ================== 라우팅 ================== */
function route(){
  var h = (location.hash || '').replace(/^#/, ''), m;
  if((m = /^v=([^/]+)\/p=(.+)$/.exec(h))) return { t:'pt', v:decodeURIComponent(m[1]), p:decodeURIComponent(m[2]) };
  if((m = /^v=(.+)$/.exec(h))) return { t:'vid', v:decodeURIComponent(m[1]) };
  if((m = /^s=(\d+)$/.exec(h))) return { t:'list', s:Math.min(SEASONS, Math.max(1, parseInt(m[1], 10))) };
  return { t:'list', s:lastSeason };
}
function go(h){ location.hash = h; }

/* ================== 렌더 ================== */
function render(keepScroll){
  var r = route(), top = viewEl.scrollTop;
  if(r.t === 'list') renderList(r.s);
  else if(r.t === 'vid') renderVideo(r.v);
  else renderPoint(r.v, r.p);
  seasonsEl.hidden = r.t !== 'list';
  lockBtn.textContent = unlocked ? '✏️' : '🔒';
  lockBtn.classList.toggle('on', unlocked);
  lockBtn.setAttribute('aria-label', unlocked ? '기록 모드 끄기(잠그기)' : '기록 모드 켜기');
  if(keepScroll) viewEl.scrollTop = top;
  paintImgs();
}

function paintSeasons(cur){
  var h = '';
  for(var i=1;i<=SEASONS;i++) h += '<button class="s' + (i === cur ? ' on' : '') + '" data-act="season" data-s="' + i + '">시즌' + i + '</button>';
  seasonsEl.innerHTML = h;
  var on = seasonsEl.querySelector('.on');
  if(on && on.scrollIntoView){ try{ on.scrollIntoView({ inline:'center', block:'nearest' }); }catch(e){} }
}

/* 지점 종류: 아파트 단지(기본 개요 + 아파트 매물 세팅) / 재개발 구역(기본 개요 + 재개발 매물 세팅) / 그 밖의 지점(역·학교 등) */
var KIND_LABEL = { apt:'아파트', redev:'재개발', spot:'지점' };
function pointKind(p){ return (p && (p.kind === 'redev' || p.kind === 'spot')) ? p.kind : 'apt'; }
/* 코스 번호: '앞 지점과 같은 코스'(sub)로 묶은 지점은 1-1, 1-2 처럼 매기고, 혼자인 코스는 그냥 1, 2 */
function pointLabels(pts){
  var courses = [], labels = [];
  pts.forEach(function(q, i){
    if(i > 0 && q.sub) courses[courses.length - 1].push(i); else courses.push([i]);
  });
  courses.forEach(function(c, ci){ c.forEach(function(idx, k){ labels[idx] = c.length > 1 ? (ci + 1) + '-' + (k + 1) : String(ci + 1); }); });
  return labels;
}
/* 지점을 목록에서 뺄 때: 묶음의 맨 앞(코스 대표)을 빼면 뒤따르던 지점이 새 코스의 대표가 된다 */
function removeFromList(list, pid){
  var i = -1;
  list.forEach(function(q, k){ if(q.pid === pid) i = k; });
  if(i < 0) return list;
  var wasHead = !list[i].sub;
  list.splice(i, 1);
  if(wasHead && list[i] && list[i].sub) list[i].sub = false;
  return list;
}
function splitNames(name){
  var sep = /\s*[·・,，/／、+]\s*/;
  var m = /^(.*?)\s*[\(（](.+)[\)）]\s*$/.exec(String(name || '').trim());
  var src = (m && sep.test(m[2])) ? m[2] : String(name || '');
  return src.split(sep).map(function(x){ return x.trim(); }).filter(Boolean);
}
/* 지점을 모두 다녀왔을 때의 임장날짜: 영상에 적어 둔 임장한 날이 있으면 그 날, 없으면 마지막으로 다녀온 날 */
function doneDate(v){
  var pts = arr(v.points);
  if(!pts.length || pts.some(function(q){ return !q.visited; })) return '';
  var last = pts.map(function(q){ return String(q.visited); }).sort().pop();
  return v.date || (/^\d{4}-\d{2}-\d{2}$/.test(last) ? last : '');
}
function visitedCount(v){ return arr(v.points).filter(function(p){ return p.visited; }).length; }

function renderList(s){
  lastSeason = s;
  try{ localStorage.setItem(SEASON_KEY, String(s)); }catch(e){}
  paintSeasons(s);
  var list = videosOf(s);
  var h = '<p class="sub">시즌' + s + ' · <b>' + list.length + '개</b> 기록</p>';
  if(!list.length){
    h += '<div class="emptybox">아직 기록한 영상이 없어요.<br>' + (unlocked ? '아래 <b>＋ 영상 추가</b>로 한 줄씩 쌓아 보세요.' : '기록 모드(🔒)를 열면 영상을 추가할 수 있어요.') + '</div>';
  }
  list.forEach(function(v){
    var n = arr(v.points).length, vis = visitedCount(v);
    var meta = n ? ('👣 ' + vis + ' / ' + n + ' 지점 다녀옴') : (v.date ? fmtDate(v.date) : '지점 기록 전');
    h += '<button class="vrow' + (v.status === 'done' ? ' done' : '') + '" data-act="video" data-id="' + esc(v.id) + '">'
      + '<span class="no">' + esc(v.no || '·') + '</span>'
      + '<span class="vt"><strong>' + esc(v.title || '제목 없는 영상') + '</strong><span>' + esc(meta) + '</span></span>'
      + (doneDate(v) ? '<span class="vdate">' + esc(fmtDate(doneDate(v))) + '</span>' : '') + '<span class="chev">›</span></button>';
  });
  if(unlocked) h += '<button class="add" data-act="add-video">＋ 영상 추가</button>';
  h += '<div class="foot-row">' + '<button class="foot-link" data-act="refresh-app">🔄 최신으로 새로고침</button><button class="foot-link" data-act="leave">이 폰에서 나가기</button></div>';

}

function ytRow(v){
  var url = safeUrl(v.yt);
  if(url) return '<a class="row" href="' + esc(url) + '" target="_blank" rel="noopener"><span class="ic">▶️</span><span class="tx">유튜브</span><span class="go">열기 ↗</span></a>';

function mapAcc(v, n, title, icon){

}
function accHTML(key, icon, title, small, panel){
  var open = !!openAcc[key];
  return '<div class="acc' + (open ? ' open' : '') + '"><button class="row" data-act="acc" data-key="' + esc(key) + '" aria-expanded="' + open + '">'

/* ---------- 매물 세팅 표 (매물 하나가 한 열) ----------
   아파트: 정보 → 전세 기준(매매·전세·자본) → 대출 기준(매매·대출·자본) → 부대비용     (초투 = 자본, 총투 = 매매)

function listingPanel(vid, pid, lsts, kind){
  var redev = kind === 'redev';

    return '<p class="none">' + (unlocked ? '아직 ' + (redev ? '물건' : '매물') + '이 없어요. 아래 버튼으로 첫 ' + (redev ? '물건' : '매물') + '을 넣어 보세요.' : '아직 ' + (redev ? '물건' : '매물') + '이 없어요') + '</p>'

  }

  var info = [
    ['정보','동 · 층','', function(L){
        return [esc(L.dong), L.floor ? esc(L.floor) + '층' : ''].filter(Boolean).join(' ') || '—'; }, 'hl txt'],
    ['','전용면적','', function(L){ return L.area ? esc(L.area) + '㎡' : '—'; }, 'hl txt']
  ];
  var rows = redev ? info.concat([
    ['매물세팅','매매','', function(L, x){ return fmtNum(x.price); }, 'pe num blue'],
    ['','추가분담금','', function(L, x){ return x.hasShare ? (x.share === 0 ? '0' : fmtNum(x.share)) : '—'; }, 'pe num'],
    ['투자','초투','매매', function(L, x){ return fmtNum(x.price); }, 'pe2 num blue strong'],
    ['','총투','매매 + 추가분담금', function(L, x){ return x.total === null ? '—' : fmtNum(x.total); }, 'pe2 num blue strong']
  ]) : info.concat([
    ['','세안고','', function(L){ return L.sealed === 'Y' ? '예' : (L.sealed === 'N' ? '아니오' : '—'); }, 'txt'],
    ['','KB시세','', function(L){ return fmtNum(parseMoney(L.kb)); }, 'num'],
    ['매물세팅','매매','', function(L, x){ return fmtNum(x.price); }, 'pe num blue'],
    ['','전세 or 대출','', function(L, x){ return x.fund ? fmtNum(x.fund) + '<small>' + x.label + '</small>' : '—'; }, 'pe num'],
    ['','자본','', function(L, x){ return ownCell(x.own); }, 'pe num blue strong'],
    ['투자','초투','자본', function(L, x){ return ownCell(x.own); }, 'pe2 num blue strong'],
    ['','총투','매매', function(L, x){ return fmtNum(x.price); }, 'pe2 num blue strong'],
    ['부대','부대비용','매매 × 0.5%', function(L, x){ return fmtNum(x.extra); }, 'num']
  ]);
  var span = {};
  rows.forEach(function(r){ if(r[0]) span[r[0]] = 0; });

  var gcls = { '정보':'a', '매물세팅':'b', '투자':'d', '부대':'c' };

  });
  t += '</tr></thead><tbody>';

    t += '<tr>';

/* ================== 팝업 · 안드로이드 뒤로가기 ==================
   시트·확인창·사진 크게 보기·잠금 팝업을 열 때 히스토리를 하나 쌓고,
   뒤로가기(popstate)에서는 앱을 나가지 않고 열린 팝업만 닫는다. */
var OVERLAY_SEL = '.sheet-wrap,.modal-wrap,.pin-wrap,.big-wrap';
var overlayHistPushed = false, overlayHistUrl = '', overlaySelfBack = false;
function anyOverlayOpen(){ return !!document.querySelector(OVERLAY_SEL); }
function pushOverlayHistory(){
  if(overlayHistPushed) return;
  try{ history.pushState({ appModal:true }, ''); overlayHistPushed = true; overlayHistUrl = location.href; }catch(e){}
}
function settleOverlayHistory(){
  if(!overlayHistPushed) return;
  setTimeout(function(){
    if(!overlayHistPushed) return;
    if(anyOverlayOpen()) return;
    overlayHistPushed = false;
    if(location.href !== overlayHistUrl) return;
    if(history.state && history.state.appModal){
      overlaySelfBack = true;
      try{ history.back(); }catch(e){ overlaySelfBack = false; }
    }
  }, 0);
}
function navHash(h){
  var target = location.pathname + location.search + (h || '');
  if(overlayHistPushed){
    overlayHistPushed = false;
    try{ history.replaceState(null, '', target); return true; }catch(e){}
  }
  location.hash = h || '';
  return false;
}
function closeAll(){
  Array.prototype.forEach.call(document.querySelectorAll(OVERLAY_SEL), function(n){ if(n._cleanup){ try{ n._cleanup(); }catch(e){} } n.remove(); });
  sheetOpen = false;
  settleOverlayHistory();
}
window.addEventListener('popstate', function(){
  if(overlaySelfBack){ overlaySelfBack = false; return; }
  if(!anyOverlayOpen()) return;
  overlayHistPushed = false;
  closeAll();
});

/* ---------- 사진·지도 크게 보기 ----------
   · 가로 사진(지도)을 세로 화면에서 열면 자동으로 눕혀서 크게 보여 준다(↻ 로 되돌리기)
   · 가능한 폰에서는 화면 방향도 가로로 잠가 본다(안 되면 눕힌 그림으로 대신)
   · 두 손가락으로 확대·축소, 한 손가락으로 이동, 두 번 탭하면 확대/원래대로, 마우스 휠도 지원 */
function openBig(key, onDelete){
  var c = imgCache[key];
  if(!c || !c.data){ toast('사진을 불러오는 중이에요'); return; }
  var wrap = document.createElement('div');
  wrap.className = 'big-wrap';
  wrap.innerHTML = '<img alt="크게 보기" draggable="false">'
    + '<button class="big-x" aria-label="닫기">✕</button>'
    + '<div class="big-hint">두 손가락으로 확대 · 끌어서 이동 · 두 번 탭하면 확대</div>'
    + '<div class="big-bar"><button data-b="out" aria-label="축소">－</button><button data-b="in" aria-label="확대">＋</button>'
    + '<button data-b="rot">↻ 돌리기</button><button data-b="fit">맞춤</button>' + (onDelete ? '<button class="d" data-b="del">🗑</button>' : '') + '</div>';
  var img = wrap.querySelector('img'), hint = wrap.querySelector('.big-hint');
  var st = { z:1, tx:0, ty:0, rot:0, nw:0, nh:0, auto:true, locked:false };
  var MAXZ = 8;

  function size(){ return { W: wrap.clientWidth || window.innerWidth, H: wrap.clientHeight || window.innerHeight }; }
  function eff(){ return st.rot ? { w: st.nh, h: st.nw } : { w: st.nw, h: st.nh }; }
  function base(){ var d = size(), e = eff(); return Math.min(d.W / e.w, d.H / e.h); }
  function apply(){
    if(!st.nw) return;
    var d = size(), e = eff(), k = base() * st.z;
    var mx = Math.max(0, (e.w * k - d.W) / 2), my = Math.max(0, (e.h * k - d.H) / 2);
    st.tx = Math.min(mx, Math.max(-mx, st.tx));
    st.ty = Math.min(my, Math.max(-my, st.ty));
    img.style.transform = 'translate(' + st.tx + 'px,' + st.ty + 'px) rotate(' + (st.rot ? 90 : 0) + 'deg) scale(' + k + ')';
    wrap.setAttribute('data-z', st.z.toFixed(2)); wrap.setAttribute('data-rot', st.rot ? '90' : '0');
  }
  function autoRot(){
    if(!st.auto || !st.nw) return;
    var d = size(), want = (st.nw > st.nh && d.H > d.W) ? 90 : 0;   /* 가로 그림 + 세로 화면 → 눕히기 */
    if((want === 90) !== !!st.rot){ st.rot = want ? 1 : 0; st.z = 1; st.tx = 0; st.ty = 0; }
  }
  function zoomAt(f, cx, cy){   /* (cx,cy): 화면 중심 기준 좌표 */
    var nz = Math.min(MAXZ, Math.max(1, st.z * f)), r = nz / st.z;
    st.tx = cx - (cx - st.tx) * r; st.ty = cy - (cy - st.ty) * r; st.z = nz;
    if(nz === 1){ st.tx = 0; st.ty = 0; }
    apply();
  }
  function rel(x, y){ var d = size(); return { x: x - d.W / 2, y: y - d.H / 2 }; }

  img.onload = function(){ st.nw = img.naturalWidth; st.nh = img.naturalHeight;
    img.style.width = st.nw + 'px'; img.style.height = st.nh + 'px'; img.style.marginLeft = (-st.nw / 2) + 'px'; img.style.marginTop = (-st.nh / 2) + 'px';
    autoRot(); apply(); };
  img.src = c.data;

  /* 포인터(터치·마우스) 제스처 */
  var ptrs = {}, pinch = null, tapT = 0, tapX = 0, tapY = 0, moved = 0, downT = 0;
  function count(){ return Object.keys(ptrs).length; }
  wrap.addEventListener('pointerdown', function(e){
    if(e.target.closest('button')) return;
    ptrs[e.pointerId] = { x:e.clientX, y:e.clientY };
    try{ wrap.setPointerCapture(e.pointerId); }catch(x){}
    moved = 0; downT = Date.now();
    if(count() === 2){ var k = Object.keys(ptrs).map(function(i){ return ptrs[i]; }); pinch = { d: Math.hypot(k[0].x - k[1].x, k[0].y - k[1].y) || 1, mx: (k[0].x + k[1].x) / 2, my: (k[0].y + k[1].y) / 2 }; }
  });
  wrap.addEventListener('pointermove', function(e){
    var p = ptrs[e.pointerId]; if(!p) return;
    var dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
    if(count() === 1){ st.tx += dx; st.ty += dy; apply(); }
    else if(count() === 2 && pinch){
      var k = Object.keys(ptrs).map(function(i){ return ptrs[i]; });
      var d = Math.hypot(k[0].x - k[1].x, k[0].y - k[1].y) || 1, mx = (k[0].x + k[1].x) / 2, my = (k[0].y + k[1].y) / 2;
      var m = rel(mx, my);
      st.tx += mx - pinch.mx; st.ty += my - pinch.my;     /* 두 손가락을 함께 옮기면 이동 */
      zoomAt(d / pinch.d, m.x, m.y);
      pinch.d = d; pinch.mx = mx; pinch.my = my;
    }
  });
  function up(e){
    var had = ptrs[e.pointerId]; delete ptrs[e.pointerId];
    if(count() < 2) pinch = null;
    if(had && count() === 0 && moved < 10 && Date.now() - downT < 350){      /* 탭 */
      var now = Date.now();
      if(now - tapT < 320 && Math.hypot(e.clientX - tapX, e.clientY - tapY) < 40){   /* 두 번 탭 */
        tapT = 0;
        if(st.z > 1.05){ st.z = 1; st.tx = 0; st.ty = 0; apply(); }
        else { var m = rel(e.clientX, e.clientY); zoomAt(2.5, m.x, m.y); }
      } else { tapT = now; tapX = e.clientX; tapY = e.clientY; }
    }
  }
  wrap.addEventListener('pointerup', up);
  wrap.addEventListener('pointercancel', up);
  wrap.addEventListener('wheel', function(e){ e.preventDefault(); var m = rel(e.clientX, e.clientY); zoomAt(e.deltaY < 0 ? 1.2 : 1 / 1.2, m.x, m.y); }, { passive:false });

  wrap.addEventListener('click', function(e){
    var b = e.target.closest('[data-b]');
    if(e.target.closest('.big-x')){ closeAll(); return; }
    if(!b) return;
    var t = b.getAttribute('data-b');
    if(t === 'in') zoomAt(1.6, 0, 0);
    else if(t === 'out') zoomAt(1 / 1.6, 0, 0);
    else if(t === 'fit'){ st.z = 1; st.tx = 0; st.ty = 0; apply(); }
    else if(t === 'rot'){ st.auto = false; st.rot = st.rot ? 0 : 1; st.z = 1; st.tx = 0; st.ty = 0; apply(); }
    else if(t === 'del'){ closeAll(); onDelete(); }
  });

  function onResize(){ autoRot(); apply(); }
  window.addEventListener('resize', onResize);
  wrap._cleanup = function(){
    window.removeEventListener('resize', onResize);
    try{ if(st.locked && screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
  };
  layer.appendChild(wrap);
  pushOverlayHistory();
  setTimeout(function(){ hint.style.opacity = '0'; }, 3200);
  /* 가능하면 폰 화면 자체를 가로로 (설치형 앱에서 되는 폰이 많음). 안 되면 눕힌 그림으로 충분히 큼 */
  img.addEventListener('load', function(){
    try{
      if(img.naturalWidth > img.naturalHeight && screen.orientation && screen.orientation.lock){
        screen.orientation.lock('landscape').then(function(){ st.locked = true; }).catch(function(){});
      }
    }catch(e){}
  });
}

/* ---------- 확인창 ---------- */
function confirmBox(title, body, okText, onOk){
  var wrap = document.createElement('div');
  wrap.className = 'modal-wrap';
  wrap.innerHTML = '<div class="modal"><h3>' + esc(title) + '</h3><p>' + body + '</p>'
    + '<div class="mrow"><button class="btn btn-ghost" data-no>취소</button><button class="btn btn-red" data-ok>' + esc(okText || '확인') + '</button></div></div>';
  wrap.addEventListener('click', function(e){
    if(e.target.closest('[data-ok]')){ closeAll(); onOk(); return; }
    if(e.target.closest('[data-no]') || e.target === wrap) closeAll();
  });
  layer.appendChild(wrap);
  sheetOpen = true;
  pushOverlayHistory();
}

/* ---------- 입력 시트 ----------
   cfg: { title, sub, fields:[{k,label,type,options,half,placeholder,req,hint,head}], data, saveText, onSave(values), onDelete, delText } */
function openSheet(cfg){
  closeAll();
  var data = cfg.data || {};
  var wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  var body = cfg.fields.map(function(f){
    if(f.head) return '<div class="fld-head">' + esc(f.head) + '</div>';
    var val = data[f.k] == null ? '' : data[f.k], ctl;
    if(f.type === 'textarea') ctl = '<textarea id="f-' + f.k + '" placeholder="' + esc(f.placeholder || '') + '">' + esc(val) + '</textarea>';
    else if(f.type === 'select') ctl = '<select id="f-' + f.k + '">' + f.options.map(function(o){
      return '<option value="' + esc(o[0]) + '"' + (String(val) === String(o[0]) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
    else ctl = '<input id="f-' + f.k + '" type="' + (f.type === 'date' ? 'date' : 'text') + '"' + (f.type === 'url' ? ' inputmode="url" autocapitalize="off" autocorrect="off"' : '')
      + (f.type === 'num' ? ' inputmode="decimal"' : '') + ' value="' + esc(val) + '" placeholder="' + esc(f.placeholder || '') + '" autocomplete="off">';
    return '<div class="fld' + (f.half ? ' half' : '') + '"><label class="fld-l" for="f-' + f.k + '">' + esc(f.label) + (f.req ? ' *' : '') + '</label>' + ctl
      + (f.hint ? '<span class="hint2">' + esc(f.hint) + '</span>' : '') + '</div>';
  }).join('');
  wrap.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-h"><div><h3>' + esc(cfg.title) + '</h3>' + (cfg.sub ? '<p>' + esc(cfg.sub) + '</p>' : '')
    + '</div><button class="sheet-x" data-x aria-label="닫기">✕</button></div><div class="sheet-b">' + body + '</div>'
    + '<div class="sheet-f">' + (cfg.onDelete ? '<button class="btn btn-danger" data-del>' + esc(cfg.delText || '삭제') + '</button>' : '')
    + (cfg.extra ? '<button class="btn btn-ghost" data-extra>' + esc(cfg.extra.text) + '</button>' : '')
    + '<button class="btn btn-navy" data-save>' + esc(cfg.saveText || '저장') + '</button></div></div>';
  wrap.addEventListener('click', function(e){
    if(e.target === wrap || e.target.closest('[data-x]')){ closeAll(); return; }
    if(e.target.closest('[data-del]')){ cfg.onDelete(); return; }
    if(e.target.closest('[data-extra]')){ cfg.extra.fn(); return; }
    if(e.target.closest('[data-save]')){
      var vals = {}, bad = null;
      cfg.fields.forEach(function(f){
        if(f.head) return;
        var el = wrap.querySelector('#f-' + f.k), v = el.value.trim();
        if(f.req && !v && !bad) bad = f;
        vals[f.k] = v;
      });
      if(bad){ toast(bad.label + '을(를) 입력해 주세요', 'err'); var el2 = wrap.querySelector('#f-' + bad.k); if(el2) el2.focus(); return; }
      cfg.onSave(vals);
    }
  });
  layer.appendChild(wrap);
  sheetOpen = true;
  pushOverlayHistory();
}

/* ---------- 지점 순서 바꾸기 · 빼기 ---------- */

  saveVideo(vid, v, '', true);

function addPhotos(vid, pid){

/* ================== 잠금 ================== */
function sha256(s){
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ('0' + b.toString(16)).slice(-2); }).join('');
  });
}
function openPin(){
  var digits = '';
  var wrap = document.createElement('div');
  wrap.className = 'pin-wrap';
  wrap.innerHTML = '<div class="pin-card"><div class="pin-fl">🔒</div><h3 class="pin-t">기록 모드</h3><p class="pin-s">세은 님 전용 편집 잠금이에요</p>'
    + '<div class="pin-dots">' + new Array(7).join('<i class="pin-dot"></i>') + '</div><p class="pin-msg"></p><div class="pad">'
    + ['1','2','3','4','5','6','7','8','9','','0','⌫'].map(function(k){
        if(k === '') return '<span></span>';
        return '<button class="key' + (k === '⌫' ? ' ghost' : '') + '" data-k="' + k + '">' + k + '</button>';
      }).join('')
    + '</div><button class="pin-x">닫기</button></div>';
  var dots = wrap.querySelectorAll('.pin-dot'), msg = wrap.querySelector('.pin-msg'), card = wrap.querySelector('.pin-card');
  var paint = function(){ Array.prototype.forEach.call(dots, function(d, i){ d.classList.toggle('on', i < digits.length); }); };
  var reset = function(text){
    digits = ''; paint(); msg.textContent = text || '';
    if(text){ card.classList.add('shake'); setTimeout(function(){ card.classList.remove('shake'); }, 380); }
  };
  var check = function(){
    if(!(window.crypto && crypto.subtle)){ msg.textContent = '보안 연결(https)에서만 열 수 있어요'; return; }
    sha256(SALT + digits).then(function(h){
      if(h === PW_HASH){
        unlocked = true;
        try{ localStorage.setItem(LS, '1'); }catch(e){}
        closeAll(); render(true); toast('기록 모드를 열었어요 ✏️');
      } else reset('비밀번호가 달라요');
    });
  };
  wrap.addEventListener('click', function(e){
    var b = e.target.closest('[data-k]');
    if(b){
      var k = b.getAttribute('data-k');
      if(k === '⌫'){ digits = digits.slice(0, -1); paint(); return; }
      if(digits.length >= 6) return;
      digits += k; paint(); msg.textContent = '';
      if(digits.length === 6) setTimeout(check, 90);
      return;
    }
    if(e.target === wrap || e.target.classList.contains('pin-x')) closeAll();
  });
  layer.appendChild(wrap);
  sheetOpen = true;
  pushOverlayHistory();
}

      if(t.getAttribute('data-del')){
        var vv = t.getAttribute('data-vid'), pp = t.getAttribute('data-p'), ph = t.getAttribute('data-ph');
        openBig(key, function(){ dropPhoto(vv, pp, ph); });
      } else openBig(key, null);
      break;
  }
});
lockBtn.addEventListener('click', function(){
  if(unlocked){
    unlocked = false;
    try{ localStorage.removeItem(LS); }catch(e){}
    render(true); toast('다시 잠갔어요 🔒');
  } else openPin();
});
window.addEventListener('hashchange', function(){ orderMode = null; render(); viewEl.scrollTop = 0; });
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible') refresh(false); });

/* ================== 입장 ==================
   처음 한 번 입장 비밀번호를 받아, 그 비밀번호로 '비밀 방 이름'을 계산합니다.
   데이터는 그 방에만 있고(서버는 방 목록을 열어 주지 않음), 비밀번호는 코드·서버 어디에도 저장하지 않습니다.
   한 번 입장한 폰은 방 이름만 기억해서 다음부터 바로 열립니다. */
function deriveRoom(pw){
  var enc = new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']).then(function(k){
    return crypto.subtle.deriveBits({ name:'PBKDF2', salt:enc.encode('imchall::room::v3'), iterations:200000, hash:'SHA-256' }, k, 256);
  }).then(function(bits){
    return 'ic' + Array.prototype.map.call(new Uint8Array(bits), function(b){ return ('0' + b.toString(16)).slice(-2); }).join('').slice(0, 48);
  });
}
function boot(){
  loadCache();
  render();
  refresh(true);
  startSync();
}
function openGate(){
  var wrap = document.createElement('div');
  wrap.className = 'gate';
  wrap.innerHTML = '<div class="gate-card"><div class="pin-fl">👣</div><h2>리훨 부부데이지<br>임장챌린지</h2>'
    + '<p>입장 비밀번호를 입력해 주세요.<br>한 번 입장한 폰은 다음부터 바로 열려요.</p>'
    + '<div class="gate-row"><input id="gatePw" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="비밀번호 (6자 이상)" aria-label="입장 비밀번호">'
    + '<button type="button" class="gate-eye" id="gateEye" aria-label="비밀번호 보기">보기</button></div>'
    + '<p class="gate-msg" id="gateMsg" role="alert"></p>'
    + '<button class="gate-go" id="gateGo">입장</button><div id="gateAsk"></div></div>';
  document.body.appendChild(wrap);
  var inp = wrap.querySelector('#gatePw'), msg = wrap.querySelector('#gateMsg'), go = wrap.querySelector('#gateGo'), ask = wrap.querySelector('#gateAsk');
  var pending = null;
  var enter = function(room){
    try{ localStorage.setItem(KEY_LS, room); }catch(e){}
    ROOM = room;
    wrap.remove();
    boot();
  };
  var submit = function(){
    var pw = inp.value.trim();
    ask.innerHTML = ''; pending = null;
    if(pw.length < 6){ msg.textContent = '6자 이상 입력해 주세요'; return; }
    if(!(window.crypto && crypto.subtle)){ msg.textContent = '보안 연결(https)에서만 열 수 있어요'; return; }
    go.disabled = true; msg.textContent = '확인하는 중…';
    deriveRoom(pw).then(function(room){
      return fetch(DB + '/rooms/' + room + '.json?shallow=true', { cache:'no-store' }).then(function(r){
        if(!r.ok) throw new Error('http ' + r.status);
        return r.json();
      }).then(function(d){
        go.disabled = false;
        if(d){ enter(room); return; }
        pending = room;
        msg.textContent = '';
        ask.innerHTML = '<p class="gate-first"><b>처음 오셨네요 👋</b><br>이 비밀번호로 저장된 기록이 아직 없어요.<br>이 비밀번호로 시작할까요? 이미 쓰던 비밀번호가 있다면 아래에서 다시 입력해 주세요.</p>'
          + '<button class="gate-go" id="gateNew" style="background:var(--yellow);color:var(--navy)">이 비밀번호로 시작하기</button>'
          + '<button class="gate-sub" id="gateAgain">다른 비밀번호로 입력</button>';
        ask.querySelector('#gateNew').addEventListener('click', function(){ if(pending) enter(pending); });
        ask.querySelector('#gateAgain').addEventListener('click', function(){ ask.innerHTML = ''; pending = null; inp.value = ''; inp.focus(); });
      });
    }).catch(function(){
      go.disabled = false;
      msg.textContent = '연결을 확인해 주세요';
    });
  };
  wrap.querySelector('#gateEye').addEventListener('click', function(){
    var on = inp.type === 'password';
    inp.type = on ? 'text' : 'password';
    this.textContent = on ? '숨기기' : '보기';
    inp.focus();
  });
  go.addEventListener('click', submit);
  inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') submit(); });
  setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 50);
}
/* 옛 화면이 붙어 있을 때 쓰는 새로고침: 앱 캐시와 서비스워커만 지운다(입장 정보·기록 모드·기록은 그대로) */
function refreshApp(){
  toast('최신 버전으로 새로고침 중…');
  var jobs = [];
  try{ if(navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); })); }catch(e){}
  try{ if(window.caches) jobs.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })); }catch(e){}
  Promise.all(jobs).catch(function(){}).then(function(){ location.reload(); });
}
function leaveRoom(){
  confirmBox('이 폰에서 나갈까요?', '이 폰에 저장된 입장 정보와 임시 저장본을 지워요.<br>서버의 기록은 그대로 남아 있어요.', '나가기', function(){
    try{ localStorage.removeItem(KEY_LS); localStorage.removeItem(CACHE_KEY); localStorage.removeItem(LS); }catch(e){}
    location.hash = '';
    location.reload();
  });
}

/* ================== 시작 ================== */
try{ unlocked = localStorage.getItem(LS) === '1'; }catch(e){}
var savedRoom = '';
try{ savedRoom = localStorage.getItem(KEY_LS) || ''; }catch(e){}
if(/^ic[0-9a-f]{48}$/.test(savedRoom)){ ROOM = savedRoom; boot(); }
else openGate();

if('serviceWorker' in navigator){
  /* 새 버전의 서비스워커가 일을 넘겨받으면(=앱이 업데이트되면) 한 번 새로고침해서 바로 새 화면을 보여 준다 */
  var swHad = !!navigator.serviceWorker.controller, swReloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(!swHad){ swHad = true; return; }   /* 처음 설치일 때는 새로고침하지 않는다 */
    if(swReloaded) return;
    if(sheetOpen || anyOverlayOpen()){ toast('새 버전이 있어요 — 앱을 다시 열면 적용돼요'); return; }
    swReloaded = true;
    location.reload();
  });
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
})();
</script>
