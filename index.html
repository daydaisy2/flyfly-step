function openListingSheet(regionId, ci, li){
  var r0 = deep(S.regions[regionId]);
  var cx = (r0.complexes || [])[ci];
  if(!cx) return;
  cx.listings = cx.listings || [];
  var isNew = (li === null || li === undefined);
  var L = isNew ? blankListing(cx) : deep(cx.listings[li] || {});
  var preset = L.preset || 'ltv70';

  var wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = '<div class="sheet"><div class="sheet-h"><div><h3>'
    + (isNew ? '🧮 매물 · 자금 세팅 추가' : '🧮 매물 · 자금 세팅 수정') + '</h3>'
    + '<p>' + esc(cx.name || '단지') + ' · 매매가·전세·대출을 넣으면 자본과 총투자금이 바로 나와요</p></div>'
    + '<button class="sheet-x" data-x aria-label="닫기">✕</button></div>'
    + '<div class="sheet-b"></div><div class="sheet-f"></div></div>';
  var body = wrap.querySelector('.sheet-b');
  var foot = wrap.querySelector('.sheet-f');
  var I = {};
  var liveBox = document.createElement('div');
  var presetWrap = null;

  function head(t){
    var d = document.createElement('div'); d.className = 'fld-head'; d.textContent = t; body.appendChild(d);
  }
  function fld(label, key, opts){
    opts = opts || {};
    var box = document.createElement('div'); box.className = 'fld';
    var lab = document.createElement('span'); lab.className = 'fld-l'; lab.textContent = label;
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.setAttribute('data-f2', key);
    if(opts.money) inp.inputMode = 'numeric';
    inp.value = opts.money
      ? (Number(L[key]) ? Number(L[key]).toLocaleString('ko-KR') : '')
      : (L[key] || '');
    if(opts.ph) inp.placeholder = opts.ph;
    box.appendChild(lab); box.appendChild(inp);
    if(opts.money){
      var h = document.createElement('span'); h.className = 'hint';
      box.appendChild(h); inp._hint = h;
      setHint(inp);
    }
    I[key] = inp;
    inp.addEventListener('input', function(){
      if(opts.money) setHint(inp);
      if(opts.after) opts.after();
      recalc();
    });
    return box;
  }
  function area(label, key, ph){
    var box = document.createElement('div'); box.className = 'fld';
    var lab = document.createElement('span'); lab.className = 'fld-l'; lab.textContent = label;
    var ta = document.createElement('textarea'); ta.rows = 2; ta.value = L[key] || ''; if(ph) ta.placeholder = ph;
    ta.setAttribute('data-f2', key);
    box.appendChild(lab); box.appendChild(ta);
    I[key] = ta;
    ta.addEventListener('input', recalc);
    return box;
  }
  function two(a, b){
    var d = document.createElement('div'); d.className = 'frow';
    d.appendChild(a); d.appendChild(b); body.appendChild(d);
  }
  function one(el){ body.appendChild(el); }
  function setHint(inp){
    if(!inp._hint) return;
    var v = parseMoney(inp.value);
    inp._hint.innerHTML = v ? '→ <b>' + fmtMoney(v) + '원</b>' : '';
  }
  function collect(){
    var o = {};
    ['name','where','dong','moveIn','households','memo'].forEach(function(k){
      o[k] = I[k] ? String(I[k].value || '').trim() : '';
    });
    ['gongsi','sise','peak','jeonseAsk','asking','maemae','jeonse','loan','loanCap','fee','tax']
      .forEach(function(k){ o[k] = I[k] ? parseMoney(I[k].value) : 0; });
    o.preset = preset;
    o.rate = I.rate ? (parseFloat(String(I.rate.value).replace(/[^\d.]/g, '')) || 0) : 0;
    o.term = I.term ? (parseInt(String(I.term.value).replace(/[^\d]/g, ''), 10) || 0) : 0;
    o.feeRate = I.feeRate ? (parseFloat(String(I.feeRate.value).replace(/[^\d.]/g, '')) || 0) : 0;
    o.houses = I.houses ? I.houses.value : '1';
    return o;
  }
  function recalc(){
    var s = seedOf(collect());
    var html = '<div class="livebox">'
      + '<div class="lr"><span class="k">자본 (초기투자금)</span><span class="v">' + fmtMoney(s.capital) + '</span></div>'
      + '<div class="lr"><span class="k">중개보수</span><span class="v">' + fmtMoney(s.fee) + '</span></div>'
      + '<div class="lr"><span class="k">취득세</span><span class="v">' + fmtMoney(s.tax) + '</span></div>'
      + '<div class="lr big"><span class="k">예상 총투자금</span><span class="v">' + fmtMoney(s.total) + '</span></div>'
      + '<div class="note">대출 ' + fmtMoney(s.loan) + ' · 월 원리금 ' + s.mPay + '만 (이자 ' + s.mInt + '만 · '
      + s.rate + '%·' + s.term + '년)' + (s.note ? ' · ' + s.note + ' 상한 적용' : '') + '</div>'
      + (s.capital < 0 ? '<div class="note" style="color:var(--red)">전세 + 대출이 매매가보다 커요</div>' : '')
      + '</div>';
    liveBox.innerHTML = html;
  }
  function paintPresets(){
    if(!presetWrap) return;
    Array.prototype.forEach.call(presetWrap.children, function(b){
      b.classList.toggle('on', b.getAttribute('data-preset') === preset);
    });
  }
  function applyPreset(){
    var s = seedOf(collect());
    I.loan.value = s.loan ? Number(s.loan).toLocaleString('ko-KR') : '';
    setHint(I.loan);
  }

  /* --- 매물 정보 --- */
  head('매 물 정 보');
  one(fld('아파트명 (평수)', 'name', { ph:'예) 꿈의숲아이파크(59)' }));
  two(fld('동 · 층향', 'dong', { ph:'예) 713동 9층' }), fld('입주가능', 'moveIn', { ph:'예) 2028년 1월' }));
  two(fld('세대수 (연식)', 'households', { ph:'예) 1,711(2022)' }), fld('시 · 구 · 동', 'where', { ph:'예) 성북구 장위동' }));
  two(fld('공시가격 (만원)', 'gongsi', { money:1, ph:'예) 68,600' }), fld('시세 (만원)', 'sise', { money:1, ph:'예) 117,500' }));
  two(fld('전고점 (만원)', 'peak', { money:1, ph:'예) 125,000' }), fld('매매 호가 (만원)', 'asking', { money:1, ph:'예) 125,000' }));
  one(fld('전세 호가 (만원)', 'jeonseAsk', { money:1, ph:'예) 75,000' }));

  /* --- 자금 세팅 --- */
  head('자 금 세 팅');
  two(fld('매매가 (만원)', 'maemae', { money:1, after:function(){ if(preset !== 'manual') applyPreset(); } }),
      fld('전세 (만원)', 'jeonse', { money:1, after:function(){ if(preset !== 'manual') applyPreset(); } }));

  var pbox = document.createElement('div'); pbox.className = 'fld';
  var plab = document.createElement('span'); plab.className = 'fld-l'; plab.textContent = '자금 세팅 전략';
  presetWrap = document.createElement('div'); presetWrap.className = 'pchips';
  PRESETS.forEach(function(p){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'pch' + (preset === p.k ? ' on' : '');
    b.textContent = p.t; b.setAttribute('data-preset', p.k);
    b.addEventListener('click', function(){
      preset = p.k;
      paintPresets();
      applyPreset();
      recalc();
    });
    presetWrap.appendChild(b);
  });
  pbox.appendChild(plab); pbox.appendChild(presetWrap);
  one(pbox);

  one(fld('대출금 (만원)', 'loan', { money:1, ph:'프리셋을 고르면 자동 계산', after:function(){
    if(preset !== 'manual'){ preset = 'manual'; paintPresets(); }
    setHint(I.loan);
  } }));
  one(fld('대출 한도 (만원)', 'loanCap', { money:1, ph:'은행 DSR 한도 · 비우면 없음',
    after:function(){ if(preset !== 'manual') applyPreset(); } }));
  two(fld('금리 (%)', 'rate', { ph:'5.0' }), fld('기간 (년)', 'term', { ph:'30' }));

  body.appendChild(liveBox);

  /* --- 부대비용 --- */
  head('부 대 비 용');
  two(fld('중개 요율 (%)', 'feeRate', { ph:'0.55', after:function(){
      var price = parseMoney(I.maemae.value);
      var rate = parseFloat(String(I.feeRate.value).replace(/[^\d.]/g, '')) || 0;
      I.fee.value = price ? Math.round(price * rate / 100).toLocaleString('ko-KR') : '';
      setHint(I.fee);
    } }),
    fld('중개보수 (만원)', 'fee', { money:1, ph:'자동 계산' }));

  var hbox = document.createElement('div'); hbox.className = 'fld';
  var hlab = document.createElement('span'); hlab.className = 'fld-l'; hlab.textContent = '주택 수';
  var hsel = document.createElement('select');
  [['1','1주택'], ['2','2주택'], ['3','3주택 이상']].forEach(function(o){
    var op = document.createElement('option'); op.value = o[0]; op.textContent = o[1]; hsel.appendChild(op);
  });
  hsel.value = L.houses || '1';
  hbox.appendChild(hlab); hbox.appendChild(hsel);
  I.houses = hsel;
  hsel.addEventListener('change', function(){
    I.tax.value = acqTax(parseMoney(I.maemae.value), hsel.value).toLocaleString('ko-KR');
    setHint(I.tax);
    recalc();
  });
  two(hbox, fld('취득세 (만원)', 'tax', { money:1, ph:'자동 계산' }));
  var note = document.createElement('p');
  note.className = 'hint';
  note.textContent = '취득세는 주택 수·금액 간이 계산이에요. 부동산계산기 금액이 있으면 직접 고쳐 주세요.';
  body.appendChild(note);

  head('메 모');
  one(area('현장 메모', 'memo', '예) 남향, 로얄층, 급매 여부'));

  /* 초기값 채우기 */
  if(!L.fee){
    var p0 = parseMoney(I.maemae.value);
    var r0v = parseFloat(String(I.feeRate.value).replace(/[^\d.]/g, '')) || 0.55;
    I.fee.value = p0 ? Math.round(p0 * r0v / 100).toLocaleString('ko-KR') : '';
    setHint(I.fee);
  }
  if(!L.tax){
    I.tax.value = acqTax(parseMoney(I.maemae.value), hsel.value).toLocaleString('ko-KR');
    setHint(I.tax);
  }
  recalc();

  /* --- 버튼 --- */
  if(!isNew){
    var del = document.createElement('button');
    del.className = 'btn btn-danger'; del.textContent = '매물 삭제';
    del.addEventListener('click', function(){
      closeAll();
      confirmBox('이 매물을 삭제할까요?', esc(L.name || '매물'), '삭제', function(){
        var r = deep(S.regions[regionId]);
        (r.complexes[ci].listings || []).splice(li, 1);
        saveRegion(regionId, r, '매물을 지웠어요');
      });
    });
    foot.appendChild(del);
  }
  var cancel = document.createElement('button');
  cancel.className = 'btn btn-ghost'; cancel.textContent = '취소';
  cancel.addEventListener('click', closeAll);
  foot.appendChild(cancel);

  var save = document.createElement('button');
  save.className = 'btn btn-navy'; save.textContent = isNew ? '매물 추가' : '저장';
  save.addEventListener('click', function(){
    var o = collect();
    if(!o.name){ toast('아파트명을 넣어 주세요', 'err'); I.name.focus(); return; }
    if(!o.maemae){ toast('매매가를 넣어 주세요', 'err'); I.maemae.focus(); return; }
    if(o.preset !== 'manual') o.loan = seedOf(o).loan;
    var r = deep(S.regions[regionId]);
    r.complexes[ci].listings = r.complexes[ci].listings || [];
    if(isNew) r.complexes[ci].listings.push(o);
    else r.complexes[ci].listings[li] = o;
    saveRegion(regionId, r, isNew ? '매물을 추가했어요 ✓' : '저장했어요 ✓');
  });
  foot.appendChild(save);

  wrap.addEventListener('click', function(e){ if(e.target === wrap) closeAll(); });
  wrap.querySelector('[data-x]').addEventListener('click', closeAll);
  layer.appendChild(wrap);
  sheetOpen = true;
  pushOverlayHistory();
}

/* ================== 잠금 ================== */
function sha256(s){
  var enc = new TextEncoder().encode(s);
  return crypto.subtle.digest('SHA-256', enc).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){
      return ('0' + b.toString(16)).slice(-2);
    }).join('');
  });
}

function openPin(){
  var digits = '';
  var wrap = document.createElement('div');
  wrap.className = 'pin-wrap';
  wrap.innerHTML = '<div class="pin-card"><div class="pin-fl">🔒</div>'
    + '<h3 class="pin-t">기록 모드</h3>'
    + '<p class="pin-s">세은 님 전용 편집 잠금이에요</p>'
    + '<div class="pin-dots">' + new Array(7).join('<i class="pin-dot"></i>') + '</div>'
    + '<p class="pin-msg"></p>'
    + '<div class="pad">'
    + ['1','2','3','4','5','6','7','8','9','','0','⌫'].map(function(k){
        if(k === '') return '<span></span>';
        return '<button class="key' + (k === '⌫' ? ' ghost' : '') + '" data-k="' + k + '">' + k + '</button>';
      }).join('')
    + '</div><button class="pin-x">닫기</button></div>';
  var dots = wrap.querySelectorAll('.pin-dot');
  var msg = wrap.querySelector('.pin-msg');
  var card = wrap.querySelector('.pin-card');
  var paint = function(){
    Array.prototype.forEach.call(dots, function(d, i){ d.classList.toggle('on', i < digits.length); });
  };
  var reset = function(text){
    digits = '';
    paint();
    msg.textContent = text || '';
    if(text){ card.classList.add('shake'); setTimeout(function(){ card.classList.remove('shake'); }, 380); }
  };
  var check = function(){
    if(!(window.crypto && crypto.subtle)){
      msg.textContent = '보안 연결(https)에서만 열 수 있어요';
      return;
    }
    sha256(SALT + digits).then(function(h){
      if(h === PW_HASH){
        unlocked = true;
        try{ localStorage.setItem(LS, '1'); }catch(e){}
        closeAll();
        render();
        toast('기록 모드를 열었어요 ✏️');
      } else {
        reset('비밀번호가 달라요');
      }
    });
  };
  wrap.addEventListener('click', function(e){
    var b = e.target.closest('[data-k]');
    if(b){
      var k = b.getAttribute('data-k');
      if(k === '⌫'){ digits = digits.slice(0, -1); paint(); return; }
      if(digits.length >= 6) return;
      digits += k;
      paint();
      msg.textContent = '';
      if(digits.length === 6) setTimeout(check, 90);
      return;
    }
    if(e.target === wrap || e.target.classList.contains('pin-x')) closeAll();
  });
  layer.appendChild(wrap);
  sheetOpen = true;
  pushOverlayHistory();
}

/* ================== 이벤트 ================== */
viewEl.addEventListener('click', function(e){
  var t = e.target.closest('[data-act]');
  if(!t) return;
  var act = t.getAttribute('data-act');
  var id = t.getAttribute('data-id');
  var i = t.getAttribute('data-i');

  if(act === 'open'){ location.hash = '#r=' + encodeURIComponent(id); return; }
  if(act === 'back'){ location.hash = ''; return; }
  if(act === 'open-map'){ openBigMap(id); return; }
  if(act === 'pick-map'){
    if(!unlocked){ toast('기록 모드에서 첨부할 수 있어요'); return; }
    pickMapImage(id); return;
  }
  if(act === 'drop-map'){
    if(!unlocked){ toast('기록 모드에서 지울 수 있어요'); return; }
    dropMapImage(id); return;
  }
  if(act === 'stamp'){
    if(!unlocked){ toast('기록 모드에서 도장을 찍을 수 있어요'); return; }
    var ciS = parseInt(i, 10);
    var dS = deep(S.regions[id]);
    if(!dS.complexes || !dS.complexes[ciS]) return;
    var cS = dS.complexes[ciS];
    if(cS.visit){ delete cS.visit; saveRegion(id, dS, '도장을 지웠어요'); }
    else { cS.visit = today(); saveRegion(id, dS, '👣 임장 도장을 찍었어요'); }
    return;
  }
  if(act === 'add-lst'){ openListingSheet(id, parseInt(i, 10), null); return; }
  if(act === 'edit-lst'){ openListingSheet(id, parseInt(i, 10), parseInt(t.getAttribute('data-k'), 10)); return; }
  if(act === 'filter'){ filter = t.getAttribute('data-f'); render(); viewEl.scrollTop = 0; return; }
  if(act === 'add-region'){ openRegionForm(null); return; }
  if(act === 'edit-region'){ openRegionForm(id); return; }
  if(act === 'del-region'){
    var nm = (S.regions[id] && S.regions[id].name) || '이 지역';
    confirmBox('이 지역을 삭제할까요?', esc(nm) + '<br>단지·인터뷰 기록까지 함께 사라져요.', '삭제', function(){ deleteRegion(id); });
    return;
  }
  if(act === 'edit-yt'){ openYtForm(id); return; }
  if(act === 'edit-route'){ openRouteForm(id); return; }
  if(act === 'edit-place'){ openPlaceForm(id); return; }
  if(act === 'edit-talk'){ openTalkForm(id); return; }
  if(act === 'add-cx'){ openCxForm(id, null); return; }
  if(act === 'edit-cx'){ openCxForm(id, parseInt(i, 10)); return; }
  if(act === 'del-cx'){
    var c = (S.regions[id].complexes || [])[parseInt(i, 10)];
    confirmBox('이 단지를 삭제할까요?', esc((c && c.name) || ''), '삭제', function(){
      var d = deep(S.regions[id]);
      d.complexes.splice(parseInt(i, 10), 1);
      saveRegion(id, d);
    });
    return;
  }
  if(act === 'check'){
    if(!unlocked){ toast('기록 모드에서 체크할 수 있어요'); return; }
    var k = t.getAttribute('data-k');
    if(S.checklist[k]) delete S.checklist[k];
    else S.checklist[k] = today();
    renderCheck();
    saveChecklist();
    return;
  }
});
